<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <title>Excel 数据处理工具（增强版）</title>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        /* 基础样式与之前类似，新增部分样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f4f8;
            color: #1e293b;
            padding: 24px;
            min-height: 100vh;
        }
        .app-container {
            max-width: 1440px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 28px 32px 40px;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #eef2f6;
        }
        .app-header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-header h1 span {
            background: #3b82f6;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .upload-area {
            background: #f8fafc;
            border: 2px dashed #d1d9e6;
            border-radius: 16px;
            padding: 16px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 24px;
            margin-bottom: 20px;
            transition: border-color 0.2s, background 0.2s;
        }
        .upload-area:hover {
            border-color: #3b82f6;
            background: #f1f5f9;
        }
        .upload-area .file-input-wrapper {
            position: relative;
            display: inline-block;
        }
        .upload-area .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .upload-area .file-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: #3b82f6;
            color: #fff;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            user-select: none;
        }
        .upload-area .file-label:hover {
            background: #2563eb;
        }
        .upload-area .file-info {
            font-size: 14px;
            color: #64748b;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .upload-area .file-info .file-name {
            color: #0f172a;
            font-weight: 500;
            background: #eef2f6;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
        }
        .upload-area .file-info .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #16a34a;
            font-weight: 500;
        }
        .upload-area .file-info .status-badge.error {
            color: #dc2626;
        }
        /* 标题行设置 */
        .header-row-setting {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
        }
        .header-row-setting label {
            font-weight: 500;
            font-size: 14px;
            color: #1e293b;
        }
        .header-row-setting input[type="number"] {
            width: 70px;
            padding: 6px 10px;
            border: 1px solid #d1d9e6;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }
        .header-row-setting input[type="number"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .header-row-setting .hint {
            font-size: 13px;
            color: #94a3b8;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }
        @media (max-width: 1000px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
        .panel {
            background: #f9fbfd;
            border-radius: 14px;
            padding: 18px 20px 20px;
            border: 1px solid #e9eef3;
        }
        .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-title .badge {
            font-size: 12px;
            font-weight: 400;
            color: #64748b;
            background: #e9eef3;
            padding: 0 12px;
            border-radius: 30px;
            line-height: 24px;
        }
        .col-select-tools {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .col-select-tools button {
            padding: 4px 16px;
            font-size: 13px;
            border-radius: 8px;
            border: 1px solid #d1d9e6;
            background: #fff;
            color: #334155;
            cursor: pointer;
            transition: all 0.15s;
            font-weight: 500;
        }
        .col-select-tools button:hover {
            background: #eef2f6;
        }
        .col-select-tools button.primary-btn {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
        }
        .col-select-tools button.primary-btn:hover {
            background: #2563eb;
            border-color: #2563eb;
        }
        .col-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            padding: 10px 14px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #e9eef3;
            align-content: flex-start;
        }
        .col-list::-webkit-scrollbar {
            width: 5px;
        }
        .col-list::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .col-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .col-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            padding: 2px 4px;
            border-radius: 4px;
            flex: 0 1 auto;
            white-space: nowrap;
        }
        .col-item:hover {
            background: #f1f5f9;
        }
        .col-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #3b82f6;
            cursor: pointer;
            flex-shrink: 0;
        }
        .col-item label {
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            color: #1e293b;
        }
        /* 计算列 */
        .calc-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }
        .calc-form .calc-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .calc-form .calc-row input,
        .calc-form .calc-row select {
            padding: 6px 12px;
            border: 1px solid #d1d9e6;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            transition: border-color 0.2s;
            flex: 1 1 100px;
            min-width: 60px;
        }
        .calc-form .calc-row input:focus,
        .calc-form .calc-row select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .calc-form .calc-row .formula-input {
            flex: 2 1 200px;
        }
        .calc-form .calc-row .btn-add {
            padding: 6px 18px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .calc-form .calc-row .btn-add:hover {
            background: #2563eb;
        }
        .calc-form .calc-row .btn-insert {
            padding: 6px 14px;
            background: #e9eef3;
            color: #1e293b;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .calc-form .calc-row .btn-insert:hover {
            background: #d1d9e6;
        }
        .calc-form .formula-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .calc-form .formula-hint code {
            background: #eef2f6;
            padding: 1px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #1e293b;
        }
        .calc-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .calc-list::-webkit-scrollbar {
            width: 4px;
        }
        .calc-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .calc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 6px 14px 6px 16px;
            border-radius: 8px;
            border: 1px solid #e9eef3;
            font-size: 14px;
            gap: 12px;
        }
        .calc-item .calc-name {
            font-weight: 500;
            color: #0f172a;
            white-space: nowrap;
        }
        .calc-item .calc-formula {
            color: #475569;
            font-family: "SF Mono", "Menlo", monospace;
            font-size: 13px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .calc-item .calc-del {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            transition: color 0.15s;
        }
        .calc-item .calc-del:hover {
            color: #dc2626;
        }
        /* 模板管理 */
        .template-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .template-area input,
        .template-area select {
            padding: 6px 12px;
            border: 1px solid #d1d9e6;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            flex: 1 1 120px;
            min-width: 80px;
            transition: border-color 0.2s;
        }
        .template-area input:focus,
        .template-area select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .template-area .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .template-area .btn-primary {
            background: #3b82f6;
            color: #fff;
        }
        .template-area .btn-primary:hover {
            background: #2563eb;
        }
        .template-area .btn-success {
            background: #22c55e;
            color: #fff;
        }
        .template-area .btn-success:hover {
            background: #16a34a;
        }
        .template-area .btn-danger {
            background: #ef4444;
            color: #fff;
        }
        .template-area .btn-danger:hover {
            background: #dc2626;
        }
        .template-area .btn-outline {
            background: #fff;
            color: #475569;
            border: 1px solid #d1d9e6;
        }
        .template-area .btn-outline:hover {
            background: #f1f5f9;
        }
        .template-status {
            font-size: 13px;
            color: #64748b;
            width: 100%;
            margin-top: 6px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .template-status .success {
            color: #16a34a;
        }
        .template-status .error {
            color: #dc2626;
        }
        /* 预览 */
        .preview-section {
            margin-top: 16px;
            border-top: 2px solid #eef2f6;
            padding-top: 18px;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }
        .preview-header .info {
            font-size: 14px;
            color: #475569;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .preview-header .info strong {
            color: #0f172a;
        }
        .preview-header .btn-export {
            padding: 8px 22px;
            background: #0f172a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .preview-header .btn-export:hover {
            background: #1e293b;
        }
        .table-wrapper {
            overflow: auto;
            border-radius: 12px;
            border: 1px solid #e9eef3;
            max-height: 420px;
            background: #fff;
        }
        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 400px;
        }
        .table-wrapper th {
            background: #f1f5f9;
            color: #1e293b;
            font-weight: 600;
            padding: 10px 16px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 2;
            white-space: nowrap;
        }
        .table-wrapper td {
            padding: 8px 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .table-wrapper tr:hover td {
            background: #f8fafc;
        }
        .table-wrapper .empty-msg {
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
        }
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
            max-width: 400px;
        }
        .toast {
            padding: 14px 22px;
            border-radius: 12px;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            animation: toastIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.success {
            background: #16a34a;
        }
        .toast.error {
            background: #dc2626;
        }
        .toast.info {
            background: #3b82f6;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .hidden {
            display: none !important;
        }
        .text-muted {
            color: #94a3b8;
            font-size: 13px;
        }
        @media (max-width: 600px) {
            .app-container {
                padding: 16px;
            }
            .upload-area {
                flex-direction: column;
                align-items: stretch;
            }
            .main-grid {
                grid-template-columns: 1fr;
            }
            .calc-form .calc-row {
                flex-direction: column;
                align-items: stretch;
            }
            .template-area {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <header class="app-header">
            <h1>📊 Excel 数据处理 <span>增强版</span></h1>
            <div class="header-actions">
                <span class="text-muted" id="fileStatus">未加载文件</span>
            </div>
        </header>

        <!-- 上传区域 -->
        <div class="upload-area" id="uploadArea">
            <div class="file-input-wrapper">
                <span class="file-label">📁 选择文件
                    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
                </span>
            </div>
            <div class="file-info">
                <span>支持 .xlsx .xls .csv</span>
                <span class="file-name" id="fileNameDisplay">未选择</span>
                <span id="rowColDisplay"></span>
                <span id="statusBadge" class="status-badge"></span>
            </div>
        </div>

        <!-- 标题行设置 -->
        <div class="header-row-setting">
            <label for="headerRowInput">📌 标题行：</label>
            <input type="number" id="headerRowInput" value="1" min="1" step="1">
            <span class="hint">（第几行为列名，默认第1行）</span>
            <button class="btn btn-primary" id="btnApplyHeader" style="padding:4px 16px;border:none;border-radius:6px;background:#3b82f6;color:#fff;cursor:pointer;">应用</button>
            <span id="headerStatus" style="font-size:13px;color:#64748b;"></span>
        </div>

        <!-- 主网格 -->
        <div class="main-grid">
            <!-- 左：列选择 -->
            <div class="panel">
                <div class="panel-title">
                    <span>📋 列选择</span>
                    <span class="badge" id="colCountBadge">0 列</span>
                </div>
                <div class="col-select-tools">
                    <button class="primary-btn" id="btnSelectAll">✅ 全选</button>
                    <button id="btnDeselectAll">⬜ 全不选</button>
                    <button id="btnInvertSelect">🔄 反选</button>
                    <span style="font-size:12px;color:#94a3b8;margin-left:4px;">按住 Shift 连选</span>
                </div>
                <div class="col-list" id="colList">
                    <div class="empty-msg" style="width:100%;text-align:center;color:#94a3b8;padding:12px 0;">请先上传文件</div>
                </div>
            </div>

            <!-- 右：计算列 + 模板 -->
            <div>
                <!-- 计算列 -->
                <div class="panel" style="margin-bottom:16px;">
                    <div class="panel-title">
                        <span>🧮 计算列</span>
                        <span class="badge" id="calcCountBadge">0 个</span>
                    </div>
                    <div class="calc-form">
                        <div class="calc-row">
                            <input type="text" id="calcNameInput" placeholder="列名，如：加购率" style="flex:1 1 120px;">
                            <input type="text" id="calcFormulaInput" placeholder='公式，如 [加购人数]/[访客数]' class="formula-input">
                        </div>
                        <div class="calc-row">
                            <select id="calcLeftCol" style="flex:1 1 80px;">
                                <option value="">左列</option>
                            </select>
                            <select id="calcOperator" style="flex:0 0 60px;">
                                <option value="+">+</option>
                                <option value="-">-</option>
                                <option value="*">*</option>
                                <option value="/">/</option>
                            </select>
                            <select id="calcRightCol" style="flex:1 1 80px;">
                                <option value="">右列</option>
                            </select>
                            <button class="btn-insert" id="btnInsertFormula">⬅ 插入公式</button>
                            <button class="btn-add" id="btnAddCalc">➕ 添加</button>
                        </div>
                        <div class="formula-hint">
                            💡 使用下拉选择列和运算符快速构建，也可手动编辑公式（用 <code>[列名]</code> 引用）
                        </div>
                    </div>
                    <div class="calc-list" id="calcList">
                        <div class="empty-msg" style="text-align:center;color:#94a3b8;padding:8px 0;">暂无计算列</div>
                    </div>
                </div>

                <!-- 模板管理 -->
                <div class="panel">
                    <div class="panel-title">
                        <span>💾 模板管理</span>
                        <span class="badge" id="templateCountBadge">0 个</span>
                    </div>
                    <div class="template-area">
                        <input type="text" id="templateNameInput" placeholder="模板名称" value="默认模板">
                        <button class="btn btn-success" id="btnSaveTemplate">💾 保存</button>
                        <select id="templateSelect">
                            <option value="">-- 加载模板 --</option>
                        </select>
                        <button class="btn btn-primary" id="btnLoadTemplate">📂 加载</button>
                        <button class="btn btn-danger" id="btnDeleteTemplate">🗑️ 删除</button>
                        <button class="btn btn-outline" id="btnRefreshTemplates">🔄 刷新</button>
                    </div>
                    <div class="template-status" id="templateStatus">
                        <span>💡 保存当前列选择 + 计算列配置，后续可快速复用</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 数据预览 -->
        <div class="preview-section">
            <div class="preview-header">
                <div class="info">
                    <span><strong>📊 数据预览</strong></span>
                    <span id="previewRowCol">—</span>
                    <span class="dim" id="previewCalcNote"></span>
                </div>
                <div>
                    <button class="btn-export" id="btnExport">⬇️ 导出 Excel</button>
                </div>
            </div>
            <div class="table-wrapper" id="tableWrapper">
                <div class="empty-msg" style="padding:60px 20px;text-align:center;color:#94a3b8;font-size:15px;">
                    📂 上传文件后，数据将在此处预览
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ================================================================
        // 状态
        // ================================================================
        const state = {
            rawData: [], // 对象数组（当前数据）
            allColumns: [],
            selectedColumns: [],
            computedColumns: [],
            fileName: '',
            fileLoaded: false,
            // 原始工作表二维数组（不包含标题）
            sheetRows: [], // 二维数组，存储所有行（原始数据，未处理标题）
            headerRowIndex: 0, // 标题行索引（0-based）
            lastCheckedIndex: -1,
        };

        // ================================================================
        // IndexDB
        // ================================================================
        const DB_NAME = 'ExcelToolDB';
        const STORE_NAME = 'templates';
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE_NAME)) {
                        d.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function dbAddTemplate(template) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const data = {
                    name: template.name || '未命名模板',
                    columns: template.columns || [],
                    computedColumns: template.computedColumns || [],
                    createdAt: Date.now(),
                };
                const req = store.add(data);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbGetAllTemplates() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbDeleteTemplate(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // ================================================================
        // 工具函数
        // ================================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', info: 'ℹ️' };
            toast.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function extractColumnNames(formula) {
            const matches = formula.match(/\[([^\]]+)\]/g);
            if (!matches) return [];
            return matches.map(m => m.slice(1, -1));
        }

        function computeFormula(formula, row) {
            let expr = formula;
            const matches = formula.match(/\[([^\]]+)\]/g);
            if (matches) {
                for (const m of matches) {
                    const colName = m.slice(1, -1);
                    let val = row[colName];
                    if (val === undefined || val === null) val = 0;
                    if (typeof val === 'string' && !isNaN(parseFloat(val)) && isFinite(val)) {
                        val = parseFloat(val);
                    }
                    if (typeof val !== 'number' || !isFinite(val)) val = 0;
                    expr = expr.replace(m, `(${val})`);
                }
            }
            const sanitized = expr.replace(/[^0-9+\-*/().\s]/g, '');
            if (sanitized !== expr) return NaN;
            try {
                const result = Function('"use strict"; return (' + sanitized + ')')();
                if (typeof result === 'number' && isFinite(result)) return result;
                return NaN;
            } catch (e) {
                return NaN;
            }
        }

        // ================================================================
        // 核心：解析文件 & 标题行处理
        // ================================================================
        async function loadFile(file) {
            try {
                const ext = file.name.split('.').pop().toLowerCase();
                const reader = new FileReader();
                let workbook;
                const data = await new Promise((resolve, reject) => {
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => reject(new Error('读取文件失败'));
                    if (ext === 'csv') {
                        reader.readAsText(file, 'UTF-8');
                    } else {
                        reader.readAsArrayBuffer(file);
                    }
                });

                if (ext === 'csv') {
                    workbook = XLSX.read(data, { type: 'string' });
                } else {
                    workbook = XLSX.read(data, { type: 'array' });
                }

                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                // 获取所有行（二维数组，包含所有数据）
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                if (!rows || rows.length === 0) {
                    showToast('文件为空', 'error');
                    return;
                }

                state.sheetRows = rows;
                state.fileName = file.name;
                // 默认标题行为第一行（索引0）
                state.headerRowIndex = 0;
                document.getElementById('headerRowInput').value = 1;
                applyHeaderRow();

                document.getElementById('fileNameDisplay').textContent = file.name;
                document.getElementById('statusBadge').textContent = '✅ 已加载';
                document.getElementById('statusBadge').className = 'status-badge';
                document.getElementById('fileStatus').textContent = `📄 ${file.name}`;

                showToast(`成功加载文件，共 ${rows.length} 行`, 'success');
            } catch (err) {
                showToast('加载失败: ' + err.message, 'error');
                console.error(err);
            }
        }

        // 应用标题行设置
        function applyHeaderRow() {
            const input = document.getElementById('headerRowInput');
            let rowNum = parseInt(input.value);
            if (isNaN(rowNum) || rowNum < 1) rowNum = 1;
            input.value = rowNum;
            const headerIdx = rowNum - 1; // 0-based

            if (!state.sheetRows || state.sheetRows.length === 0) {
                document.getElementById('headerStatus').textContent = '⚠️ 请先上传文件';
                return;
            }

            if (headerIdx >= state.sheetRows.length) {
                document.getElementById('headerStatus').textContent = '❌ 标题行超出总行数';
                showToast('标题行超出总行数', 'error');
                return;
            }

            state.headerRowIndex = headerIdx;
            const headerRow = state.sheetRows[headerIdx];
            // 列名：取该行所有非空字符串，去重
            let columns = headerRow.map(v => String(v).trim()).filter(v => v !== '');
            // 如果列名有重复，追加序号
            const colCount = columns.length;
            const colMap = {};
            for (let i = 0; i < colCount; i++) {
                let name = columns[i] || `列${i+1}`;
                if (colMap[name] !== undefined) {
                    let suffix = 2;
                    while (colMap[name + '_' + suffix] !== undefined) suffix++;
                    name = name + '_' + suffix;
                }
                colMap[name] = i;
                columns[i] = name;
            }
            // 如果某些列名为空，补默认
            for (let i = 0; i < colCount; i++) {
                if (!columns[i] || columns[i] === '') {
                    let name = `列${i+1}`;
                    let suffix = 1;
                    while (colMap[name + (suffix > 1 ? '_' + suffix : '')] !== undefined) suffix++;
                    if (suffix > 1) name = name + '_' + suffix;
                    columns[i] = name;
                    colMap[name] = i;
                }
            }

            // 数据行：标题行之后的所有行，转为对象数组
            const dataRows = state.sheetRows.slice(headerIdx + 1);
            const jsonData = dataRows.map(row => {
                const obj = {};
                columns.forEach((col, idx) => {
                    obj[col] = (row[idx] !== undefined) ? row[idx] : '';
                });
                return obj;
            });

            state.rawData = jsonData;
            state.allColumns = columns;
            state.selectedColumns = [...columns];
            state.computedColumns = [];
            state.fileLoaded = true;

            // 更新界面
            document.getElementById('rowColDisplay').textContent = `${jsonData.length} 行 × ${columns.length} 列`;
            document.getElementById('headerStatus').textContent = `✅ 标题行设置为第 ${rowNum} 行 (${columns.length} 列)`;
            renderColumns();
            renderCalcList();
            updateCounts();
            renderPreview();
            updateColumnDropdowns();
            showToast(`数据已更新，标题行: 第 ${rowNum} 行`, 'success');
        }

        // ================================================================
        // 渲染函数
        // ================================================================
        function renderColumns() {
            const container = document.getElementById('colList');
            if (!state.fileLoaded || state.allColumns.length === 0) {
                container.innerHTML = `<div class="empty-msg" style="width:100%;text-align:center;padding:12px 0;">请先上传文件</div>`;
                return;
            }
            let html = '';
            state.allColumns.forEach((col, idx) => {
                const checked = state.selectedColumns.includes(col) ? 'checked' : '';
                html += `
                        <div class="col-item" data-index="${idx}">
                            <input type="checkbox" id="col_${idx}" value="${col}" ${checked} data-col="${col}">
                            <label for="col_${idx}">${col}</label>
                        </div>
                    `;
            });
            container.innerHTML = html;
            // 事件绑定
            const checkboxes = container.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach((cb, idx) => {
                cb.addEventListener('change', (e) => {
                    const col = e.target.value;
                    if (e.target.checked) {
                        if (!state.selectedColumns.includes(col)) state.selectedColumns.push(col);
                    } else {
                        state.selectedColumns = state.selectedColumns.filter(c => c !== col);
                    }
                    updateCounts();
                    renderPreview();
                });
                cb.addEventListener('click', (e) => {
                    if (e.shiftKey && state.lastCheckedIndex >= 0 && state.lastCheckedIndex !== idx) {
                        const start = Math.min(state.lastCheckedIndex, idx);
                        const end = Math.max(state.lastCheckedIndex, idx);
                        const allCbs = container.querySelectorAll('input[type="checkbox"]');
                        const checkedState = allCbs[state.lastCheckedIndex].checked;
                        for (let i = start; i <= end; i++) {
                            const cb2 = allCbs[i];
                            cb2.checked = checkedState;
                            const col2 = cb2.value;
                            if (checkedState) {
                                if (!state.selectedColumns.includes(col2)) state.selectedColumns.push(col2);
                            } else {
                                state.selectedColumns = state.selectedColumns.filter(c => c !== col2);
                            }
                        }
                        updateCounts();
                        renderPreview();
                        e.preventDefault();
                    }
                    state.lastCheckedIndex = idx;
                });
            });
        }

        function renderCalcList() {
            const container = document.getElementById('calcList');
            if (state.computedColumns.length === 0) {
                container.innerHTML = `<div class="empty-msg" style="text-align:center;padding:8px 0;">暂无计算列</div>`;
                return;
            }
            let html = '';
            state.computedColumns.forEach((item, idx) => {
                html += `
                        <div class="calc-item" data-idx="${idx}">
                            <span class="calc-name">${item.name}</span>
                            <span class="calc-formula">= ${item.formula}</span>
                            <button class="calc-del" data-idx="${idx}" title="删除">✕</button>
                        </div>
                    `;
            });
            container.innerHTML = html;
            container.querySelectorAll('.calc-del').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    state.computedColumns.splice(idx, 1);
                    renderCalcList();
                    updateCounts();
                    renderPreview();
                    updateColumnDropdowns();
                    showToast('已删除计算列', 'info');
                });
            });
        }

        function updateColumnDropdowns() {
            // 更新左列和右列下拉选项（原始列 + 计算列）
            const leftSel = document.getElementById('calcLeftCol');
            const rightSel = document.getElementById('calcRightCol');
            const allCols = [...state.allColumns, ...state.computedColumns.map(c => c.name)];
            const currentLeft = leftSel.value;
            const currentRight = rightSel.value;
            leftSel.innerHTML = '<option value="">左列</option>';
            rightSel.innerHTML = '<option value="">右列</option>';
            allCols.forEach(col => {
                const opt1 = document.createElement('option');
                opt1.value = col;
                opt1.textContent = col;
                leftSel.appendChild(opt1);
                const opt2 = document.createElement('option');
                opt2.value = col;
                opt2.textContent = col;
                rightSel.appendChild(opt2);
            });
            if (allCols.includes(currentLeft)) leftSel.value = currentLeft;
            if (allCols.includes(currentRight)) rightSel.value = currentRight;
        }

        function updateCounts() {
            document.getElementById('colCountBadge').textContent = `${state.selectedColumns.length} / ${state.allColumns.length} 列`;
            document.getElementById('calcCountBadge').textContent = `${state.computedColumns.length} 个`;
        }

        function renderPreview() {
            const wrapper = document.getElementById('tableWrapper');
            const rowCol = document.getElementById('previewRowCol');
            if (!state.fileLoaded || state.rawData.length === 0) {
                wrapper.innerHTML =
                    `<div class="empty-msg" style="padding:60px 20px;text-align:center;color:#94a3b8;">📂 上传文件后，数据将在此处预览</div>`;
                rowCol.textContent = '—';
                return;
            }
            const displayCols = [...state.selectedColumns];
            const calcNames = state.computedColumns.map(c => c.name);
            const allDisplayCols = [...displayCols, ...calcNames];
            if (allDisplayCols.length === 0) {
                wrapper.innerHTML =
                    `<div class="empty-msg" style="padding:40px 20px;text-align:center;color:#94a3b8;">⚠️ 请至少选择一列</div>`;
                rowCol.textContent = '0 列';
                return;
            }
            const maxRows = Math.min(state.rawData.length, 200);
            const rows = [];
            for (let i = 0; i < maxRows; i++) {
                const row = { ...state.rawData[i] };
                for (const calc of state.computedColumns) {
                    row[calc.name] = computeFormula(calc.formula, row);
                }
                rows.push(row);
            }
            let html = '<table><thead><tr>';
            for (const col of allDisplayCols) {
                const isCalc = state.computedColumns.some(c => c.name === col);
                html += `<th>${col} ${isCalc ? '🧮' : ''}</th>`;
            }
            html += '</tr></thead><tbody>';
            if (rows.length === 0) {
                html += `<tr><td colspan="${allDisplayCols.length}" style="text-align:center;padding:30px;color:#94a3b8;">无数据</td></tr>`;
            } else {
                for (const row of rows) {
                    html += '<tr>';
                    for (const col of allDisplayCols) {
                        let val = row[col];
                        if (val === undefined || val === null) val = '';
                        if (typeof val === 'number' && !Number.isInteger(val) && isFinite(val)) {
                            val = val.toFixed(4).replace(/\.?0+$/, '');
                        }
                        html += `<td title="${String(val)}">${String(val)}</td>`;
                    }
                    html += '</tr>';
                }
                if (state.rawData.length > 200) {
                    html += `<tr><td colspan="${allDisplayCols.length}" style="text-align:center;color:#94a3b8;font-size:13px;padding:8px;">
                                仅显示前 200 行，共 ${state.rawData.length} 行
                            </td></tr>`;
                }
            }
            html += '</tbody></table>';
            wrapper.innerHTML = html;
            rowCol.textContent = `${state.rawData.length} 行 × ${allDisplayCols.length} 列`;
            document.getElementById('previewCalcNote').textContent =
                state.computedColumns.length > 0 ? ` (含 ${state.computedColumns.length} 个计算列)` : '';
        }

        // ================================================================
        // 添加计算列
        // ================================================================
        function addComputedColumn() {
            const nameInput = document.getElementById('calcNameInput');
            const formulaInput = document.getElementById('calcFormulaInput');
            const name = nameInput.value.trim();
            const formula = formulaInput.value.trim();
            if (!name) { showToast('请输入列名', 'error');
                nameInput.focus(); return; }
            if (!formula) { showToast('请输入公式', 'error');
                formulaInput.focus(); return; }
            const allNames = [...state.allColumns, ...state.computedColumns.map(c => c.name)];
            if (allNames.includes(name)) { showToast(`列名 "${name}" 已存在`, 'error');
                nameInput.focus(); return; }
            const refs = extractColumnNames(formula);
            const available = [...state.allColumns, ...state.computedColumns.map(c => c.name)];
            const missing = refs.filter(r => !available.includes(r));
            if (missing.length > 0) { showToast(`公式引用了不存在的列: ${missing.join(', ')}`, 'error'); return; }
            // 测试计算
            if (state.rawData.length > 0) {
                const testRow = { ...state.rawData[0] };
                for (const c of state.computedColumns) testRow[c.name] = computeFormula(c.formula, testRow);
                const result = computeFormula(formula, testRow);
                if (isNaN(result) || !isFinite(result)) { showToast('公式计算测试失败，请检查', 'error'); return; }
            }
            state.computedColumns.push({ name, formula });
            nameInput.value = '';
            formulaInput.value = '';
            renderCalcList();
            updateCounts();
            renderPreview();
            updateColumnDropdowns();
            showToast(`✅ 已添加计算列: ${name}`, 'success');
        }

        // ================================================================
        // 模板管理
        // ================================================================
        async function saveTemplate() {
            const nameInput = document.getElementById('templateNameInput');
            const name = nameInput.value.trim() || '未命名模板';
            if (!state.fileLoaded) { showToast('请先加载数据文件', 'error'); return; }
            if (state.selectedColumns.length === 0 && state.computedColumns.length === 0) {
                showToast('至少选择一列或添加一个计算列', 'error');
                return;
            }
            const template = {
                name: name,
                columns: [...state.selectedColumns],
                computedColumns: state.computedColumns.map(c => ({ ...c })),
            };
            try {
                await dbAddTemplate(template);
                showToast(`✅ 模板 "${name}" 已保存`, 'success');
                await refreshTemplateList();
                const templates = await dbGetAllTemplates();
                const latest = templates[templates.length - 1];
                if (latest) document.getElementById('templateSelect').value = latest.id;
                document.getElementById('templateStatus').innerHTML = `<span class="success">✅ 模板 "${name}" 已保存到 IndexDB</span>`;
            } catch (err) {
                showToast('保存失败: ' + err.message, 'error');
            }
        }

        async function refreshTemplateList() {
            try {
                const templates = await dbGetAllTemplates();
                const select = document.getElementById('templateSelect');
                const currentVal = select.value;
                select.innerHTML = '<option value="">-- 加载模板 --</option>';
                for (const t of templates) {
                    const opt = document.createElement('option');
                    opt.value = t.id;
                    const calcInfo = t.computedColumns && t.computedColumns.length > 0 ?
                        ` (${t.computedColumns.length}个计算列)` : '';
                    opt.textContent = `${t.name} (${t.columns ? t.columns.length : 0}列${calcInfo})`;
                    select.appendChild(opt);
                }
                if (currentVal && templates.some(t => t.id == currentVal)) select.value = currentVal;
                document.getElementById('templateCountBadge').textContent = `${templates.length} 个模板`;
                return templates;
            } catch (err) {
                console.error('刷新模板列表失败:', err);
                return [];
            }
        }

        async function loadTemplate() {
            const select = document.getElementById('templateSelect');
            const id = select.value;
            if (!id) { showToast('请选择一个模板', 'error'); return; }
            if (!state.fileLoaded) { showToast('请先加载数据文件', 'error'); return; }
            try {
                const templates = await dbGetAllTemplates();
                const template = templates.find(t => t.id == id);
                if (!template) { showToast('模板不存在', 'error'); return; }
                const missingCols = template.columns.filter(c => !state.allColumns.includes(c));
                if (missingCols.length > 0) {
                    showToast(`⚠️ 以下列不存在: ${missingCols.join(', ')}，将忽略`, 'error');
                    const existCols = template.columns.filter(c => state.allColumns.includes(c));
                    state.selectedColumns = existCols.length > 0 ? existCols : [...state.allColumns];
                } else {
                    state.selectedColumns = [...template.columns];
                }
                // 加载计算列，跳过无效的
                const validCalc = [];
                for (const c of template.computedColumns) {
                    const refs = extractColumnNames(c.formula);
                    const available = [...state.allColumns, ...validCalc.map(v => v.name)];
                    const missing = refs.filter(r => !available.includes(r));
                    if (missing.length === 0) {
                        validCalc.push(c);
                    } else {
                        showToast(`⚠️ 计算列 "${c.name}" 引用了不存在的列，已跳过`, 'error');
                    }
                }
                state.computedColumns = validCalc;
                renderColumns();
                renderCalcList();
                updateCounts();
                renderPreview();
                updateColumnDropdowns();
                document.getElementById('templateStatus').innerHTML =
                    `<span class="success">✅ 已加载模板 "${template.name}"</span>`;
                showToast(`✅ 已加载模板 "${template.name}"`, 'success');
            } catch (err) {
                showToast('加载模板失败: ' + err.message, 'error');
            }
        }

        async function deleteTemplate() {
            const select = document.getElementById('templateSelect');
            const id = select.value;
            if (!id) { showToast('请选择一个模板', 'error'); return; }
            if (!confirm('确认删除该模板吗？')) return;
            try {
                await dbDeleteTemplate(Number(id));
                showToast('✅ 模板已删除', 'success');
                await refreshTemplateList();
                document.getElementById('templateStatus').innerHTML = `<span>模板已删除</span>`;
            } catch (err) {
                showToast('删除失败: ' + err.message, 'error');
            }
        }

        // ================================================================
        // 导出
        // ================================================================
        function exportExcel() {
            if (!state.fileLoaded || state.rawData.length === 0) {
                showToast('没有数据可导出', 'error');
                return;
            }
            const displayCols = [...state.selectedColumns];
            const calcNames = state.computedColumns.map(c => c.name);
            const allDisplayCols = [...displayCols, ...calcNames];
            if (allDisplayCols.length === 0) { showToast('请至少选择一列', 'error'); return; }
            const exportData = [];
            for (const row of state.rawData) {
                const newRow = {};
                for (const col of displayCols) newRow[col] = row[col] !== undefined ? row[col] : '';
                for (const calc of state.computedColumns) {
                    const val = computeFormula(calc.formula, row);
                    newRow[calc.name] = isNaN(val) || !isFinite(val) ? '' : val;
                }
                exportData.push(newRow);
            }
            try {
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
                const colWidths = allDisplayCols.map(c => ({ wch: Math.max(c.length * 1.2, 12) }));
                ws['!cols'] = colWidths;
                const fileName = state.fileName.replace(/\.[^.]+$/, '') + '_处理结果.xlsx';
                XLSX.writeFile(wb, fileName);
                showToast(`✅ 导出成功: ${fileName}`, 'success');
            } catch (err) {
                showToast('导出失败: ' + err.message, 'error');
            }
        }

        // ================================================================
        // 列选择辅助
        // ================================================================
        function selectAllColumns() { state.selectedColumns = [...state.allColumns];
            renderColumns();
            updateCounts();
            renderPreview(); }

        function deselectAllColumns() { state.selectedColumns = [];
            renderColumns();
            updateCounts();
            renderPreview(); }

        function invertSelectColumns() {
            state.selectedColumns = state.allColumns.filter(c => !state.selectedColumns.includes(c));
            renderColumns();
            updateCounts();
            renderPreview();
        }

        // ================================================================
        // 插入公式辅助
        // ================================================================
        function insertFormula() {
            const left = document.getElementById('calcLeftCol').value;
            const operator = document.getElementById('calcOperator').value;
            const right = document.getElementById('calcRightCol').value;
            if (!left || !right) { showToast('请选择左列和右列', 'error'); return; }
            if (left === right) { showToast('左右列不能相同', 'error'); return; }
            const formula = `[${left}] ${operator} [${right}]`;
            const input = document.getElementById('calcFormulaInput');
            // 如果输入框为空则直接填入，否则在后面追加
            if (input.value.trim() === '') {
                input.value = formula;
            } else {
                input.value += ' ' + formula;
            }
            input.focus();
            showToast(`已插入公式: ${formula}`, 'info');
        }

        // ================================================================
        // 初始化
        // ================================================================
        async function init() {
            try {
                await openDB();
                await refreshTemplateList();
                console.log('✅ IndexDB 就绪');
            } catch (err) {
                console.error('IndexDB 初始化失败:', err);
                showToast('数据库初始化失败', 'error');
            }

            // 文件上传
            document.getElementById('fileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) loadFile(file);
                e.target.value = '';
            });
            // 拖拽
            const uploadArea = document.getElementById('uploadArea');
            uploadArea.addEventListener('dragover', (e) => { e.preventDefault();
                uploadArea.style.borderColor = '#3b82f6';
                uploadArea.style.background = '#eff6ff'; });
            uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#d1d9e6';
                uploadArea.style.background = '#f8fafc'; });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#d1d9e6';
                uploadArea.style.background = '#f8fafc';
                const file = e.dataTransfer.files[0];
                if (file) loadFile(file);
            });

            // 标题行应用
            document.getElementById('btnApplyHeader').addEventListener('click', applyHeaderRow);
            document.getElementById('headerRowInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') applyHeaderRow();
            });

            // 列选择
            document.getElementById('btnSelectAll').addEventListener('click', selectAllColumns);
            document.getElementById('btnDeselectAll').addEventListener('click', deselectAllColumns);
            document.getElementById('btnInvertSelect').addEventListener('click', invertSelectColumns);

            // 计算列
            document.getElementById('btnAddCalc').addEventListener('click', addComputedColumn);
            document.getElementById('btnInsertFormula').addEventListener('click', insertFormula);
            document.getElementById('calcFormulaInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') addComputedColumn();
            });

            // 模板
            document.getElementById('btnSaveTemplate').addEventListener('click', saveTemplate);
            document.getElementById('btnLoadTemplate').addEventListener('click', loadTemplate);
            document.getElementById('btnDeleteTemplate').addEventListener('click', deleteTemplate);
            document.getElementById('btnRefreshTemplates').addEventListener('click', async () => {
                await refreshTemplateList();
                showToast('已刷新模板列表', 'info');
            });

            // 导出
            document.getElementById('btnExport').addEventListener('click', exportExcel);

            // 快捷键 Ctrl+S 保存模板
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveTemplate();
                }
            });

            console.log('🚀 Excel 数据处理工具（增强版）已初始化');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
