<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航 · 文件合并工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f9fe;
            /* 与合并工具页面完全一致的背景色 */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 24px;
        }

        .card-grid {
            max-width: 480px;
            width: 100%;
        }

        .nav-card {
            background: white;
            border-radius: 48px;
            padding: 40px 32px 44px;
            box-shadow: 0 20px 40px rgba(0, 20, 60, 0.12);
            transition: transform 0.25s ease, box-shadow 0.35s ease;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            display: block;
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .nav-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 32px 48px -16px rgba(18, 52, 106, 0.20);
            background: white;
            border-color: #b9cef0;
        }

        .nav-card:active {
            transform: scale(0.97) translateY(0px);
            transition-duration: 0.08s;
        }

        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            width: 80px;
            height: 80px;
            border-radius: 32px;
            margin-bottom: 22px;
            box-shadow: 0 12px 24px -8px rgba(37, 99, 235, 0.30);
            font-size: 44px;
            color: white;
            transition: transform 0.2s ease;
        }

        .nav-card:hover .icon-wrapper {
            transform: rotate(-4deg) scale(1.02);
        }

        .card-title {
            font-size: 28px;
            font-weight: 620;
            letter-spacing: -0.3px;
            color: #0b1f3b;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 16px;
            line-height: 1.6;
            color: #2c4a6e;
            opacity: 0.85;
            max-width: 320px;
            margin: 0 auto 12px;
        }

        .badge-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 12px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #e3ecf7;
        }

        .badge {
            background: #f0f6ff;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #1a3f7a;
            letter-spacing: 0.2px;
            border: 1px solid #dce7f5;
        }

        .badge i {
            font-style: normal;
            margin-right: 4px;
        }

        .arrow-hint {
            display: inline-block;
            margin-left: 6px;
            transition: transform 0.25s ease;
            font-size: 18px;
        }

        .nav-card:hover .arrow-hint {
            transform: translateX(6px);
        }

        .footer-meta {
            margin-top: 28px;
            font-size: 14px;
            color: #4d6a8f;
            text-align: center;
            opacity: 0.7;
            letter-spacing: 0.2px;
        }

        .footer-meta a {
            color: #1d4ed8;
            text-decoration: none;
            border-bottom: 1px dotted rgba(29, 78, 216, 0.25);
        }

        .footer-meta a:hover {
            border-bottom-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="card-grid">
        <!-- 整个卡片作为可点击链接，跳转到合并工具页面 -->
        <a href="tools/merge_excel.html" class="nav-card" title="打开 Excel / CSV 文件合并工具">
            <div class="icon-wrapper">📂</div>
            <h2 class="card-title">
                文件合并工具
                <span class="arrow-hint">→</span>
            </h2>
            <p class="card-desc">
                合并多个 Excel 或 CSV 文件，自动添加“来源文件名”列。
            </p>

            <div class="badge-group">
                <span class="badge"><i>📄</i> .xls</span>
                <span class="badge"><i>📊</i> .xlsx</span>
                <span class="badge"><i>📋</i> .csv</span>
            </div>

            <div style="margin-top: 20px; font-size: 15px; color: #2563eb; font-weight: 500; opacity: 0.8;">
                点击进入 →
            </div>
        </a>

    </div>

</body>

</html>
