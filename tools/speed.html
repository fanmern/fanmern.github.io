<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>实时速度计</title>
<style>
  :root{
    --bg:#0b0f17;
    --text:#e8eef7;
    --muted:#7d8ba1;
    --accent:#3ddc97;
    --track:#1a2231;
    --card:#141a26;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(circle at 50% 0%,#16202f 0%,#0b0f17 62%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));
    min-height:100vh;min-height:100dvh;
    overflow-x:hidden;
    user-select:none;
  }

  header{text-align:center;}
  h1{
    font-size:14px;font-weight:600;letter-spacing:.22em;
    color:var(--muted);margin:0;text-transform:uppercase;
  }

  /* ===== 仪表盘 ===== */
  .gauge{
    position:relative;
    width:min(74vw,300px);
    aspect-ratio:1/1;
    flex-shrink:0;
  }
  .gauge svg{
    width:100%;height:100%;
    transform:rotate(-90deg);
    display:block;
  }
  .track{
    fill:none;stroke:var(--track);stroke-width:13;
  }
  .progress{
    fill:none;
    stroke:var(--accent);
    stroke-width:13;
    stroke-linecap:round;
    opacity:0;
    transition:stroke-dashoffset .35s cubic-bezier(.22,1,.36,1),
               opacity .3s ease,
               stroke .5s ease;
    filter:drop-shadow(0 0 8px rgba(61,220,151,.45));
  }
  .readout{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  .value{
    font-size:clamp(48px,17vw,82px);
    font-weight:700;
    line-height:1;
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum";
  }
  .unit{
    margin-top:10px;
    font-size:14px;
    letter-spacing:.14em;
    color:var(--muted);
  }

  /* ===== 状态 ===== */
  .status{
    display:flex;align-items:center;gap:8px;
    font-size:13.5px;color:var(--muted);
    min-height:20px;
    text-align:center;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#41506a;flex-shrink:0;
    transition:background .3s ease;
  }
  .dot.ok{background:#3ddc97;box-shadow:0 0 8px rgba(61,220,151,.7);}
  .dot.waiting{background:#ffd166;animation:pulse 1.2s ease-in-out infinite;}
  .dot.warn{background:#ffa94d;}
  .dot.error{background:#ff6b6b;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  /* ===== 数据卡片 ===== */
  .stats{
    display:flex;gap:10px;width:min(88vw,340px);
  }
  .stat{
    flex:1;
    background:var(--card);
    border:1px solid rgba(255,255,255,.05);
    border-radius:14px;
    padding:10px 12px;
    display:flex;flex-direction:column;gap:4px;
  }
  .stat .k{font-size:11px;color:var(--muted);letter-spacing:.06em;}
  .stat .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}

  /* ===== 单位切换 ===== */
  .units{
    display:flex;gap:6px;
    background:var(--card);
    border-radius:12px;padding:4px;
    border:1px solid rgba(255,255,255,.05);
  }
  .unit-btn{
    appearance:none;border:0;background:transparent;
    color:var(--muted);
    font-size:13px;font-weight:600;
    padding:8px 16px;border-radius:9px;
    cursor:pointer;font-family:inherit;
    transition:all .2s ease;
  }
  .unit-btn.active{
    background:rgba(61,220,151,.14);
    color:var(--accent);
  }

  /* ===== 主按钮 ===== */
  .main-btn{
    appearance:none;border:0;cursor:pointer;
    font-family:inherit;font-size:16px;font-weight:600;
    width:min(88vw,340px);
    padding:16px;border-radius:16px;
    background:var(--accent);
    color:#06120c;
    letter-spacing:.04em;
    transition:transform .12s ease,background .25s ease,box-shadow .25s ease;
    box-shadow:0 8px 26px -10px rgba(61,220,151,.8);
  }
  .main-btn:active{transform:scale(.975);}
  .main-btn.active{
    background:rgba(255,107,107,.14);
    color:#ff8b8b;
    box-shadow:none;
    border:1px solid rgba(255,107,107,.35);
  }

  footer{
    font-size:11.5px;color:#4d5a70;text-align:center;line-height:1.6;
    max-width:320px;
  }
</style>
</head>
<body>

  <header>
    <h1>Speedometer</h1>
  </header>

  <!-- 仪表盘 -->
  <div class="gauge">
    <svg viewBox="0 0 260 260" aria-hidden="true">
      <circle class="track" cx="130" cy="130" r="116"></circle>
      <circle class="progress" id="ringProgress" cx="130" cy="130" r="116"></circle>
    </svg>
    <div class="readout">
      <div class="value" id="speedValue">0.0</div>
      <div class="unit" id="speedUnit">km/h</div>
    </div>
  </div>

  <!-- 状态 -->
  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">点击下方按钮开始测量</span>
  </div>

  <!-- 数据 -->
  <div class="stats">
    <div class="stat">
      <span class="k">最高速度</span>
      <span class="v" id="maxSpeed">0.0 km/h</span>
    </div>
    <div class="stat">
      <span class="k">定位精度</span>
      <span class="v" id="accuracy">—</span>
    </div>
  </div>

  <!-- 单位 -->
  <div class="units">
    <button class="unit-btn active" data-unit="kmh">km/h</button>
    <button class="unit-btn" data-unit="mph">mph</button>
    <button class="unit-btn" data-unit="ms">m/s</button>
  </div>

  <button class="main-btn" id="toggleBtn">开始测量</button>

  <footer>
    需在 HTTPS 环境下运行并授权定位权限<br>
    室内或隧道中 GPS 信号弱，速度可能不准确
  </footer>

<script>
'use strict';

/* ================= 配置 ================= */
const MAX_SCALE_KMH = 120;                 // 仪表盘满刻度（km/h）
const RING_R        = 116;
const CIRCUMFERENCE = 2 * Math.PI * RING_R;

const UNITS = {
  kmh: { label: 'km/h', factor: 3.6,       digits: 1 },
  mph: { label: 'mph',  factor: 2.2369363, digits: 1 },
  ms:  { label: 'm/s',  factor: 1,         digits: 2 }
};

/* ================= 元素 ================= */
const el = {
  value:    document.getElementById('speedValue'),
  unit:     document.getElementById('speedUnit'),
  ring:     document.getElementById('ringProgress'),
  status:   document.getElementById('statusText'),
  dot:      document.getElementById('statusDot'),
  accuracy: document.getElementById('accuracy'),
  maxSpeed: document.getElementById('maxSpeed'),
  toggle:   document.getElementById('toggleBtn'),
  unitBtns: Array.from(document.querySelectorAll('.unit-btn'))
};

/* ================= 状态 ================= */
let unit        = 'kmh';
let running     = false;
let watchId     = null;
let lastFix     = null;    // { lat, lon, t }
let smooth      = null;    // 平滑后的速度，单位 m/s
let maxSpeedMps = 0;
let lastUpdate  = 0;
let wakeLock    = null;
let firstFixTimer = null;

/* ================= 工具函数 ================= */
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const rad = d => d * Math.PI / 180;
  const dLat = rad(lat2 - lat1);
  const dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

function setStatus(text, type) {
  el.status.textContent = text;
  el.dot.className = 'dot' + (type ? ' ' + type : '');
}

/* 指数移动平均：时间间隔越长越信任新值 */
function applySmoothing(prev, next, dtMs) {
  if (prev === null) return next;
  const alpha = Math.min(1, Math.max(0.18, dtMs / 2200));
  return prev + alpha * (next - prev);
}

/* ================= 渲染 ================= */
function render() {
  const u = UNITS[unit];
  const v = (smooth || 0) * u.factor;

  el.value.textContent = v.toFixed(u.digits);
  el.unit.textContent  = u.label;

  // 圆环进度（按当前单位等比换算满刻度）
  const maxInUnit = MAX_SCALE_KMH * (u.factor / 3.6);
  const ratio     = Math.min(1, Math.max(0, v / maxInUnit));

  el.ring.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio) + 'px';
  el.ring.style.opacity = ratio > 0.004 ? 1 : 0;

  // 随速度变化的强调色
  let color = '#3ddc97';
  if (ratio > 0.78)      color = '#ff6b6b';
  else if (ratio > 0.5)  color = '#ffd166';
  document.documentElement.style.setProperty('--accent', color);

  // 最高速度
  el.maxSpeed.textContent =
    (maxSpeedMps * u.factor).toFixed(u.digits) + ' ' + u.label;
}

/* ================= 定位回调 ================= */
function onPosition(pos) {
  clearTimeout(firstFixTimer);

  const c   = pos.coords;
  const now = pos.timestamp || Date.now();

  let raw = null;
  let dt  = lastFix ? (now - lastFix.t) / 1000 : 0;

  // ① 优先使用 GPS 原生速度
  if (typeof c.speed === 'number' && isFinite(c.speed) && c.speed >= 0) {
    raw = c.speed;
  }
  // ② 降级：用两次定位的位移 / 时间差推算
  else if (lastFix && dt >= 1) {
    const dist = haversine(lastFix.lat, lastFix.lon, c.latitude, c.longitude);
    const noiseFloor = Math.max(3, c.accuracy * 0.5);  // 抖动阈值
    raw = dist < noiseFloor ? 0 : dist / dt;
  }

  // 过滤异常值（>360 km/h 视为错误）
  if (raw !== null && raw > 100) raw = null;

  if (raw !== null) {
    const gap = lastUpdate ? now - lastUpdate : 1000;
    smooth     = applySmoothing(smooth, raw, gap);
    lastUpdate = now;
    if (smooth > maxSpeedMps) maxSpeedMps = smooth;
    render();
  }

  lastFix = { lat: c.latitude, lon: c.longitude, t: now };

  // 状态与精度
  const acc = Math.round(c.accuracy);
  el.accuracy.textContent = acc + ' m';

  if (acc > 60)      setStatus('GPS 信号弱（精度 ' + acc + ' m），请到开阔处', 'warn');
  else if (acc > 25) setStatus('定位中…（精度 ' + acc + ' m）', 'waiting');
  else               setStatus('GPS 已定位，精度 ' + acc + ' m', 'ok');
}

function onError(err) {
  switch (err.code) {
    case err.PERMISSION_DENIED:
      setStatus('定位权限被拒绝，请在浏览器设置中开启', 'error');
      stop();
      break;
    case err.POSITION_UNAVAILABLE:
      setStatus('无法获取定位信息，请检查 GPS 是否开启', 'error');
      break;
    case err.TIMEOUT:
      setStatus('定位超时，正在重试…', 'waiting');
      break;
    default:
      setStatus('定位出错：' + err.message, 'error');
  }
}

/* ================= 屏幕常亮 ================= */
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* 忽略：部分浏览器不支持 */ }
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running && !wakeLock) {
    requestWakeLock();
  }
});

/* ================= 启动 / 停止 ================= */
function start() {
  if (!('geolocation' in navigator)) {
    setStatus('当前浏览器不支持定位功能', 'error');
    return;
  }

  running     = true;
  smooth      = null;
  lastFix     = null;
  lastUpdate  = 0;

  el.toggle.textContent = '停止';
  el.toggle.classList.add('active');
  setStatus('正在搜索 GPS 信号…', 'waiting');

  requestWakeLock();

  watchId = navigator.geolocation.watchPosition(onPosition, onError, {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 20000
  });

  // 15 秒仍无定位则提示
  firstFixTimer = setTimeout(() => {
    if (running && !lastFix) {
      setStatus('仍未获取定位，请到空旷处并确认已授权', 'warn');
    }
  }, 15000);
}

function stop() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  clearTimeout(firstFixTimer);
  running = false;

  el.toggle.textContent = '开始测量';
  el.toggle.classList.remove('active');

  if (!el.status.textContent.includes('拒绝')) {
    setStatus('已停止', '');
  }
  releaseWakeLock();
}

el.toggle.addEventListener('click', () => {
  running ? stop() : start();
});

/* ================= 单位切换 ================= */
el.unitBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    unit = btn.dataset.unit;
    el.unitBtns.forEach(b => b.classList.toggle('active', b === btn));
    render();
  });
});

/* ================= 初始化 ================= */
(function init() {
  el.ring.style.strokeDasharray  = CIRCUMFERENCE + 'px';
  el.ring.style.strokeDashoffset = CIRCUMFERENCE + 'px';
  render();

  if (!window.isSecureContext) {
    setStatus('当前非 HTTPS 环境，定位功能可能被浏览器禁用', 'error');
  }
})();
</script>
</body>
</html>
