<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<title>月度数据汇总工具 · 支付金额 / 去退金额 / 推广花费</title>
<script src="https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#3b82f6; --primary-dark:#2563eb; --primary-light:#dbeafe; --primary-soft:#eff6ff;
  --success:#10b981; --success-dark:#059669; --success-light:#d1fae5;
  --warning:#f59e0b; --warning-light:#fef3c7;
  --danger:#ef4444; --danger-light:#fee2e2;
  --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1;
  --slate-400:#94a3b8; --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155;
  --slate-800:#1e293b; --slate-900:#0f172a;
  --radius:12px; --radius-lg:20px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow:0 4px 12px rgba(15,23,42,.08);
  --shadow-lg:0 20px 60px rgba(15,23,42,.10);
  --shadow-primary:0 8px 20px -4px rgba(59,130,246,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  background:linear-gradient(160deg,#f0f4f8 0%,#e6edf5 60%,#dde7f2 100%);
  color:var(--slate-800); line-height:1.6; min-height:100vh;
  padding:24px 16px 48px; -webkit-font-smoothing:antialiased;
}

/* ============ 主容器 ============ */
.app{
  max-width:1180px; margin:0 auto; background:#fff;
  border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); overflow:hidden;
}

/* ============ 头部 ============ */
.header{
  background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 55%,#3b82f6 100%);
  padding:26px 32px; color:#fff; display:flex; align-items:center;
  justify-content:space-between; gap:16px; flex-wrap:wrap; position:relative; overflow:hidden;
}
.header::before{
  content:""; position:absolute; right:-40px; top:-60px; width:240px; height:240px;
  background:radial-gradient(circle,rgba(255,255,255,.14) 0%,transparent 70%);
  border-radius:50%; pointer-events:none;
}
.header::after{
  content:""; position:absolute; right:80px; bottom:-80px; width:180px; height:180px;
  background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 70%);
  border-radius:50%; pointer-events:none;
}
.header-left{display:flex; align-items:center; gap:14px; position:relative; z-index:1}
.header-icon{
  width:52px; height:52px; border-radius:16px; display:flex; align-items:center;
  justify-content:center; font-size:26px; background:rgba(255,255,255,.18);
  backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.25); flex-shrink:0;
}
.header h1{font-size:22px; font-weight:700; letter-spacing:-.3px; margin-bottom:2px}
.header p{font-size:13px; opacity:.85; font-weight:400}
.header-back{
  position:relative; z-index:1; color:#fff; text-decoration:none; font-size:13.5px;
  padding:8px 16px; border-radius:10px; background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.22); transition:all .18s; white-space:nowrap;
}
.header-back:hover{background:rgba(255,255,255,.24); transform:translateX(-2px)}

/* ============ 卡片 / 步骤 ============ */
.card{padding:26px 32px; border-bottom:1px solid var(--slate-100)}
.card:last-child{border-bottom:none}
.step-title{display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap}
.step-num{
  width:28px; height:28px; border-radius:9px; display:inline-flex; align-items:center;
  justify-content:center; font-size:13px; font-weight:700; color:#fff;
  background:linear-gradient(135deg,#3b82f6,#2563eb); box-shadow:0 4px 10px -2px rgba(59,130,246,.4);
  flex-shrink:0;
}
.step-title h2{font-size:16px; font-weight:650; color:var(--slate-900); letter-spacing:-.2px}
.step-hint{font-size:12.5px; color:var(--slate-400); margin-left:auto; font-weight:400}

/* ============ 上传区 ============ */
.upload-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
@media(max-width:820px){.upload-grid{grid-template-columns:1fr}}
.dropzone{
  position:relative; border:2px dashed var(--slate-300); border-radius:var(--radius);
  padding:20px 16px; text-align:center; background:var(--slate-50);
  transition:all .22s ease; cursor:pointer; display:flex; flex-direction:column;
  justify-content:center; min-height:132px; gap:5px;
}
.dropzone:hover{border-color:var(--primary); background:var(--primary-soft); transform:translateY(-1px)}
.dropzone.drag{border-color:var(--primary); background:var(--primary-light); box-shadow:var(--shadow-primary)}
.dropzone.filled{
  border-style:solid; border-color:var(--success); background:linear-gradient(180deg,#f0fdf4 0%,#ecfdf5 100%);
}
.dz-icon{font-size:26px; line-height:1; margin-bottom:2px}
.dz-title{font-size:14px; font-weight:650; color:var(--slate-800)}
.dz-desc{font-size:11.5px; color:var(--slate-500)}
.dz-file{
  font-size:11.5px; color:var(--slate-400); margin-top:6px; padding:3px 10px;
  border-radius:20px; background:var(--slate-100); display:inline-block;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  transition:all .2s;
}
.dropzone.filled .dz-file{background:var(--success-light); color:var(--success-dark); font-weight:500}
.dropzone input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 20px; border-radius:10px; font-size:13.5px; font-weight:600;
  border:none; cursor:pointer; transition:all .18s ease; white-space:nowrap;
  font-family:inherit; letter-spacing:-.1px;
}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important; box-shadow:none !important}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; box-shadow:var(--shadow-primary)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 10px 24px -4px rgba(59,130,246,.45)}
.btn-primary:active:not(:disabled){transform:translateY(0)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669); color:#fff; box-shadow:0 8px 20px -4px rgba(16,185,129,.35)}
.btn-success:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 10px 24px -4px rgba(16,185,129,.45)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; box-shadow:0 8px 20px -4px rgba(239,68,68,.35)}
.btn-danger:hover:not(:disabled){transform:translateY(-1px)}
.btn-ghost{background:#fff; color:var(--slate-600); border:1.5px solid var(--slate-200)}
.btn-ghost:hover:not(:disabled){background:var(--slate-50); border-color:var(--slate-300); color:var(--slate-800)}
.btn-lg{padding:12px 28px; font-size:14.5px; border-radius:12px}
.btn-sm{padding:5px 13px; font-size:12.5px; border-radius:8px}

/* ============ 操作栏 ============ */
.action-bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:18px}
.status-text{font-size:13px; color:var(--slate-500); margin-left:4px}

/* ============ 类目选择 ============ */
.cat-tools{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center}
.cat-tools .divider{width:1px; height:18px; background:var(--slate-200); margin:0 4px}
.cat-list{
  display:flex; flex-wrap:wrap; gap:9px; padding:16px;
  background:var(--slate-50); border-radius:var(--radius);
  border:1px solid var(--slate-200); min-height:60px;
}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:7px 14px;
  border:1.5px solid var(--slate-200); border-radius:10px; cursor:pointer;
  background:#fff; font-size:13px; color:var(--slate-600); font-weight:500;
  user-select:none; transition:all .16s ease; position:relative;
}
.chip:hover{border-color:var(--primary); color:var(--primary); background:var(--primary-soft)}
.chip.on{
  background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff;
  border-color:transparent; box-shadow:0 4px 12px -2px rgba(59,130,246,.4);
}
.chip.on:hover{background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff}
.chip .cnt{
  font-size:11px; padding:1px 7px; border-radius:10px;
  background:var(--slate-100); color:var(--slate-500); font-weight:600; margin-left:2px;
}
.chip.on .cnt{background:rgba(255,255,255,.22); color:#fff}

/* ============ 归并规则 ============ */
.merge-details{margin-top:16px; border:1px solid var(--slate-200); border-radius:var(--radius); overflow:hidden}
.merge-details summary{
  padding:11px 16px; cursor:pointer; font-size:13.5px; font-weight:600;
  color:var(--slate-600); background:var(--slate-50); user-select:none;
  list-style:none; display:flex; align-items:center; gap:8px; transition:background .15s;
}
.merge-details summary::-webkit-details-marker{display:none}
.merge-details summary::before{
  content:"▸"; transition:transform .2s; display:inline-block; font-size:11px; color:var(--slate-400);
}
.merge-details[open] summary::before{transform:rotate(90deg)}
.merge-details summary:hover{background:var(--slate-100)}
.merge-body{padding:14px 16px; border-top:1px solid var(--slate-200); background:#fff}
.merge-hint{font-size:12.5px; color:var(--slate-500); margin-bottom:10px}
.merge-hint code{
  background:var(--slate-100); padding:1px 7px; border-radius:5px;
  font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--slate-700);
}
#mergeRules{
  width:100%; min-height:88px; padding:11px 13px; border:1.5px solid var(--slate-200);
  border-radius:10px; font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12.5px; line-height:1.6; resize:vertical; color:var(--slate-700);
  transition:border-color .18s, box-shadow .18s; background:#fff;
}
#mergeRules:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,130,246,.13)}

/* ============ 模板栏 ============ */
.template-bar{
  display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:18px;
  padding:14px 16px; background:linear-gradient(135deg,#f8fafc,#f1f5f9);
  border-radius:var(--radius); border:1px solid var(--slate-200);
}
.tpl-input{
  flex:1 1 180px; min-width:140px; padding:9px 13px; border:1.5px solid var(--slate-200);
  border-radius:9px; font-size:13.5px; font-family:inherit; background:#fff;
  transition:border-color .18s, box-shadow .18s; color:var(--slate-700);
}
.tpl-input:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,130,246,.13)}
.tpl-select{
  flex:1 1 180px; min-width:140px; padding:9px 13px; border:1.5px solid var(--slate-200);
  border-radius:9px; font-size:13.5px; font-family:inherit; background:#fff;
  color:var(--slate-700); cursor:pointer; transition:border-color .18s, box-shadow .18s;
}
.tpl-select:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,130,246,.13)}

/* ============ 预览表 ============ */
.preview-wrap{
  overflow:auto; max-height:560px; border:1px solid var(--slate-200);
  border-radius:var(--radius); background:#fff; position:relative;
}
.preview-wrap table{border-collapse:separate; border-spacing:0; font-size:12.5px; width:100%}
.preview-wrap th,.preview-wrap td{
  padding:9px 14px; text-align:right; white-space:nowrap;
  border-bottom:1px solid var(--slate-100); border-right:1px solid var(--slate-100);
}
.preview-wrap thead th{
  background:linear-gradient(180deg,#f8fafc,#f1f5f9); color:var(--slate-700);
  font-weight:650; font-size:12px; text-align:center; position:sticky; top:0;
  z-index:3; border-bottom:2px solid var(--slate-200); letter-spacing:.2px;
}
.preview-wrap thead tr:nth-child(2) th{top:36px; z-index:2; font-size:11.5px; color:var(--slate-500)}
.preview-wrap tbody td:first-child,
.preview-wrap tfoot td:first-child,
.preview-wrap thead th:first-child{
  position:sticky; left:0; text-align:left; font-weight:650; color:var(--slate-800);
  background:#fff; z-index:4; box-shadow:2px 0 0 var(--slate-100); min-width:120px;
}
.preview-wrap thead th:first-child{background:linear-gradient(180deg,#f8fafc,#f1f5f9); z-index:5}
.preview-wrap tbody tr:hover td{background:#fafcff}
.preview-wrap tbody tr:hover td:first-child{background:#fafcff}
.preview-wrap tfoot td{
  background:#f8fafc; font-weight:700; color:var(--slate-800);
  border-top:2px solid var(--slate-200); position:sticky; bottom:0;
}
.preview-wrap tfoot td:first-child{background:#f8fafc; z-index:4}
.preview-wrap .zero{color:#cbd5e1}
.preview-wrap .neg{color:var(--danger); font-weight:600}
.preview-wrap .ad-cost{color:#7c3aed}
.preview-wrap .pay{color:#0369a1}
.preview-wrap .net{color:#059669}

/* ============ 日志 ============ */
.log-box{
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:12px;
  line-height:1.75; background:var(--slate-900); color:#cbd5e1; padding:16px 18px;
  border-radius:var(--radius); max-height:220px; overflow-y:auto; white-space:pre-wrap;
  word-break:break-word;
}
.log-box::-webkit-scrollbar{width:8px}
.log-box::-webkit-scrollbar-track{background:rgba(255,255,255,.03)}
.log-box::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15); border-radius:8px}
.log-box .ok{color:#4ade80}
.log-box .warn{color:#fbbf24}
.log-box .err{color:#f87171}
.log-box .info{color:#60a5fa}
.log-box .dim{color:#64748b}

/* ============ 空状态 ============ */
.empty{
  padding:48px 20px; text-align:center; color:var(--slate-400); font-size:14px;
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.empty .ico{font-size:36px; opacity:.5}

/* ============ Toast ============ */
.toast-wrap{position:fixed; bottom:26px; right:26px; display:flex; flex-direction:column; gap:10px; z-index:9999; max-width:380px}
.toast{
  padding:13px 20px; border-radius:12px; background:var(--slate-900); color:#fff;
  font-size:13.5px; font-weight:500; box-shadow:0 16px 40px rgba(0,0,0,.22);
  display:flex; align-items:center; gap:10px; animation:toastIn .3s cubic-bezier(.22,1,.36,1);
  border:1px solid rgba(255,255,255,.08);
}
.toast.success{background:linear-gradient(135deg,#10b981,#059669)}
.toast.error{background:linear-gradient(135deg,#ef4444,#dc2626)}
.toast.info{background:linear-gradient(135deg,#3b82f6,#2563eb)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ============ 响应式 ============ */
@media(max-width:720px){
  body{padding:12px 10px 32px}
  .card{padding:20px 18px}
  .header{padding:20px 18px}
  .header h1{font-size:18px}
  .header-icon{width:42px; height:42px; font-size:21px; border-radius:13px}
  .step-hint{display:none}
  .template-bar{padding:12px}
  .toast-wrap{left:14px; right:14px; bottom:14px; max-width:none}
}
</style>
</head>
<body>

<div class="app">

  <!-- ============ 头部 ============ -->
  <header class="header">
    <div class="header-left">
      <div class="header-icon">📊</div>
      <div>
        <h1>月度数据汇总工具</h1>
        <p>按类目 × 月份汇总 · 支付金额 / 去退金额 / 推广花费</p>
      </div>
    </div>
    <a href="../tools.html" class="header-back">← 返回工具集</a>
  </header>

  <!-- ============ 步骤 1：上传 ============ -->
  <section class="card">
    <div class="step-title">
      <span class="step-num">1</span>
      <h2>上传数据文件</h2>
      <span class="step-hint">支持 .xlsx / .xls / .csv · 可拖拽到对应卡片</span>
    </div>

    <div class="upload-grid">
      <div class="dropzone" data-type="cat">
        <div class="dz-icon">🗂️</div>
        <div class="dz-title">类目映射表</div>
        <div class="dz-desc">需要「商品ID」「类目」两列</div>
        <div class="dz-file">未选择</div>
        <input type="file" accept=".xlsx,.xls,.csv">
      </div>

      <div class="dropzone" data-type="std">
        <div class="dz-icon">📋</div>
        <div class="dz-title">品类-标准类目</div>
        <div class="dz-desc">支付金额 · 退款金额 · 可多选</div>
        <div class="dz-file">未选择</div>
        <input type="file" accept=".xlsx,.xls,.csv" multiple>
      </div>

      <div class="dropzone" data-type="ad">
        <div class="dz-icon">📢</div>
        <div class="dz-title">推广商品明细</div>
        <div class="dz-desc">推广消耗 · 按商品ID归集 · 可多选</div>
        <div class="dz-file">未选择</div>
        <input type="file" accept=".xlsx,.xls,.csv" multiple>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-primary btn-lg" id="btnRun">▶ 开始解析</button>
      <button class="btn btn-ghost" id="btnReset">清空全部</button>
      <span class="status-text" id="runStatus"></span>
    </div>
  </section>

  <!-- ============ 步骤 2：类目选择 ============ -->
  <section class="card" id="pickSection" style="display:none">
    <div class="step-title">
      <span class="step-num">2</span>
      <h2>选择输出类目</h2>
      <span class="step-hint" id="catHint"></span>
    </div>

    <div class="cat-tools">
      <button class="btn btn-sm btn-ghost" id="btnAll">全选</button>
      <button class="btn btn-sm btn-ghost" id="btnNone">全不选</button>
      <button class="btn btn-sm btn-ghost" id="btnInvert">反选</button>
      <span class="divider"></span>
      <button class="btn btn-sm btn-ghost" id="btnDefault">恢复默认六大类目</button>
    </div>

    <div class="cat-list" id="catList"></div>

    <details class="merge-details">
      <summary>类目归并规则（可选）</summary>
      <div class="merge-body">
        <p class="merge-hint">
          每行一条，格式 <code>源类目=目标类目</code>。仅影响「推广花费」的归集——因为标准类目表本身已是大类。
        </p>
        <textarea id="mergeRules" placeholder="健身裤=瑜伽长裤&#10;打底裤=瑜伽长裤&#10;半身裙=瑜伽短裙&#10;运动背心=瑜伽背心"></textarea>
      </div>
    </details>

    <div class="template-bar">
      <input type="text" class="tpl-input" id="tplName" placeholder="模板名称，如：六大类目">
      <button class="btn btn-success" id="btnSaveTpl">💾 保存模板</button>
      <select class="tpl-select" id="tplSelect">
        <option value="">-- 我的模板 --</option>
      </select>
      <button class="btn btn-primary" id="btnLoadTpl">📂 加载</button>
      <button class="btn btn-danger" id="btnDelTpl">🗑 删除</button>
    </div>
  </section>

  <!-- ============ 步骤 3：预览 ============ -->
  <section class="card" id="previewSection" style="display:none">
    <div class="step-title">
      <span class="step-num">3</span>
      <h2>数据预览</h2>
      <span class="step-hint" id="previewHint"></span>
    </div>
    <div class="preview-wrap" id="previewWrap"></div>
    <div class="action-bar">
      <button class="btn btn-primary btn-lg" id="btnExport">⬇ 导出 Excel</button>
      <span class="status-text" id="exportStatus"></span>
    </div>
  </section>

  <!-- ============ 日志 ============ -->
  <section class="card">
    <div class="step-title">
      <span class="step-num" style="background:linear-gradient(135deg,#64748b,#475569); box-shadow:none">·</span>
      <h2>运行日志</h2>
      <span class="step-hint" id="logHint"></span>
    </div>
    <div class="log-box" id="logBox">等待操作…</div>
  </section>

</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ================================================================
   常量
   ================================================================ */
const DEFAULT_CATS = ['瑜伽背心','瑜伽长裤','瑜伽中/短裤','瑜伽t恤','瑜伽短裙','瑜伽外套'];
const DB_NAME  = 'MonthlySummaryDB';
const DB_STORE = 'templates';

/* ================================================================
   全局状态
   ================================================================ */
const state = {
  catMap:      {},   // 商品ID -> 类目
  payData:     {},   // 月份 -> { 类目: {pay, refund} }
  adRaw:       [],   // [{month, id, name, cost}]
  adData:      {},   // 月份 -> { 类目: 消耗 }
  unmatched:   {},   // 月份 -> [{id, name, cost}]
  allCats:     new Set(),
  selectedCats:new Set(),
  files:       { cat: null, std: [], ad: [] },
};

/* ================================================================
   IndexedDB
   ================================================================ */
let db = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(DB_STORE)){
        d.createObjectStore(DB_STORE, { keyPath:'id', autoIncrement:true });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror   = e => reject(e.target.error);
  });
}
function dbAdd(tpl){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const req = tx.objectStore(DB_STORE).add(tpl);
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}
function dbAll(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}
function dbDel(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const req = tx.objectStore(DB_STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror   = () => reject(req.error);
  });
}

/* ================================================================
   工具函数
   ================================================================ */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function normId(v){
  if (v == null) return '';
  if (typeof v === 'number') return String(Math.round(v));
  let s = String(v).trim();
  if (/^\d+\.0+$/.test(s)) s = s.split('.')[0];
  return s.replace(/[^\dA-Za-z]/g,'');
}
function toNum(v){
  if (v == null) return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  const s = String(v).replace(/[,，\s¥￥$%]/g,'');
  if (s === '' || s === '-' || s === '--' || s === '/') return 0;
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function r2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function fmt(n){
  if (!n) return '0';
  return Number(n).toLocaleString('zh-CN', { maximumFractionDigits:2 });
}

/* 从文件名解析月份：优先 YYYY-MM-DD，其次 YYYYMMDD */
function monthFromName(name){
  let m = name.match(/(\d{4})-(\d{2})-\d{2}/);
  if (m) return m[1] + '-' + m[2];
  m = name.match(/(\d{4})(\d{2})(\d{2})/);
  if (m) return m[1] + '-' + m[2];
  return null;
}

function readWorkbook(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = e => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
        resolve(wb);
      } catch (err){ reject(new Error('文件解析失败：' + err.message)); }
    };
    fr.onerror = () => reject(new Error('文件读取失败'));
    fr.readAsArrayBuffer(file);
  });
}

function firstSheetRows(wb){
  const name = wb.SheetNames[0];
  const ws = wb.Sheets[name];
  if (!ws) return [];
  return XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null, blankrows:false });
}

/* 在前 N 行中找到同时包含所有 required 列名的行 */
function findHeaderRow(rows, required, limit){
  limit = limit || 30;
  for (let i = 0; i < Math.min(rows.length, limit); i++){
    const r = (rows[i] || []).map(c => c == null ? '' : String(c).trim());
    if (required.every(h => r.includes(h))) return i;
  }
  return -1;
}

/* ================================================================
   日志 & Toast
   ================================================================ */
function log(msg, cls){
  const box = $('logBox');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}
function clearLog(){
  $('logBox').innerHTML = '';
  $('logHint').textContent = '';
}
function showToast(msg, type){
  const wrap = $('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  const icons = { success:'✅', error:'❌', info:'ℹ️' };
  el.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'all .3s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => el.remove(), 320);
  }, 2800);
}

/* ================================================================
   解析：类目映射表
   ================================================================ */
async function parseCatFile(file){
  const wb   = await readWorkbook(file);
  const rows = firstSheetRows(wb);
  const hi   = findHeaderRow(rows, ['商品ID','类目']);
  if (hi < 0) throw new Error('未找到「商品ID / 类目」表头，请检查文件格式');

  const header = rows[hi].map(c => c == null ? '' : String(c).trim());
  const iId    = header.indexOf('商品ID');
  const iCat   = header.indexOf('类目');

  let n = 0;
  for (let i = hi + 1; i < rows.length; i++){
    const r = rows[i];
    if (!r) continue;
    const id  = normId(r[iId]);
    const cat = r[iCat] == null ? '' : String(r[iCat]).trim();
    if (id && cat){ state.catMap[id] = cat; n++; }
  }
  log(`  ✓ ${file.name}　→　读取 ${n} 条「商品ID → 类目」映射`, 'ok');
  return n;
}

/* ================================================================
   解析：品类-标准类目（支付金额 / 退款金额）
   ================================================================ */
async function parseStdFile(file){
  const month = monthFromName(file.name);
  if (!month) throw new Error('文件名未识别到月份，需形如「2026-09-30」或「20260930」');

  const wb   = await readWorkbook(file);
  const rows = firstSheetRows(wb);
  const hi   = findHeaderRow(rows, ['类目名称','支付金额']);
  if (hi < 0) throw new Error('未找到「类目名称 / 支付金额」表头');

  const header = rows[hi].map(c => c == null ? '' : String(c).trim());
  const iL2    = header.indexOf('二级类目名称');
  const iCat   = header.indexOf('类目名称');
  const iPay   = header.indexOf('支付金额');
  const iRef   = header.indexOf('售中售后成功退款金额');

  const bucket = state.payData[month] || (state.payData[month] = {});
  let n = 0;

  for (let i = hi + 1; i < rows.length; i++){
    const r = rows[i];
    if (!r) continue;

    const l2  = iL2 >= 0 && r[iL2] != null ? String(r[iL2]).trim() : '';
    const cat = r[iCat] == null ? '' : String(r[iCat]).trim();
    if (!cat) continue;

    /* 跳过汇总行：二级类目名称 === 类目名称 */
    if (iL2 >= 0 && l2 === cat) continue;

    const pay = toNum(r[iPay]);
    const ref = iRef >= 0 ? toNum(r[iRef]) : 0;

    const b = bucket[cat] || (bucket[cat] = { pay:0, refund:0 });
    b.pay    += pay;
    b.refund += ref;
    state.allCats.add(cat);
    n++;
  }

  log(`  ✓ ${file.name}　→　月份 ${month}，读取 ${n} 行类目数据`, 'ok');
  return n;
}

/* ================================================================
   解析：推广商品（推广消耗）—— 缓存原始行，类目归集另行计算
   ================================================================ */
async function parseAdFile(file){
  const month = monthFromName(file.name);
  if (!month) throw new Error('文件名未识别到月份');

  const wb   = await readWorkbook(file);
  const rows = firstSheetRows(wb);
  const hi   = findHeaderRow(rows, ['商品ID','推广消耗']);
  if (hi < 0) throw new Error('未找到「商品ID / 推广消耗」表头');

  const header = rows[hi].map(c => c == null ? '' : String(c).trim());
  const iId    = header.indexOf('商品ID');
  const iName  = header.indexOf('商品名称');
  const iCost  = header.indexOf('推广消耗');

  let n = 0;
  for (let i = hi + 1; i < rows.length; i++){
    const r = rows[i];
    if (!r) continue;
    const id = normId(r[iId]);
    if (!id) continue;
    state.adRaw.push({
      month,
      id,
      name: iName >= 0 && r[iName] != null ? String(r[iName]) : '',
      cost: toNum(r[iCost]),
    });
    n++;
  }

  log(`  ✓ ${file.name}　→　月份 ${month}，读取 ${n} 个商品`, 'ok');
  return n;
}

/* ================================================================
   归集推广消耗到类目（应用归并规则）
   ================================================================ */
function parseMergeRules(text){
  const map = {};
  String(text || '').split(/[\n,;，；]+/).forEach(line => {
    line = line.trim();
    if (!line) return;
    const parts = line.split(/[=＝>→]+/).map(s => s.trim()).filter(Boolean);
    if (parts.length === 2 && parts[0] !== parts[1]) map[parts[0]] = parts[1];
  });
  return map;
}

function computeAdData(){
  const rules = parseMergeRules($('mergeRules').value);
  state.adData = {};
  state.unmatched = {};

  for (const row of state.adRaw){
    const m = row.month;
    const bucket = state.adData[m] || (state.adData[m] = {});
    const miss   = state.unmatched[m] || (state.unmatched[m] = []);

    let cat = state.catMap[row.id];
    if (cat && rules[cat]) cat = rules[cat];

    if (cat){
      bucket[cat] = (bucket[cat] || 0) + row.cost;
      state.allCats.add(cat);
    } else {
      miss.push({ id: row.id, name: row.name, cost: row.cost });
    }
  }
}

/* ================================================================
   主流程
   ================================================================ */
async function run(){
  const btn = $('btnRun');
  btn.disabled = true;
  $('runStatus').textContent = '解析中…';
  clearLog();

  state.catMap = {}; state.payData = {}; state.adRaw = [];
  state.adData = {}; state.unmatched = {}; state.allCats = new Set();

  try {
    const fCat = state.files.cat;
    const fStd = state.files.std;
    const fAd  = state.files.ad;

    if (!fCat && !fStd.length && !fAd.length){
      log('⚠ 请先选择至少一个文件', 'warn');
      showToast('请先选择文件', 'error');
      return;
    }

    /* 1. 类目映射 */
    if (fCat){
      log('【1/3】解析类目映射表…', 'info');
      try { await parseCatFile(fCat); }
      catch (e){ log('  ✗ ' + e.message, 'err'); }
    } else {
      log('⚠ 未上传「类目.xlsx」——推广花费将全部无法归集', 'warn');
    }

    /* 2. 标准类目 */
    if (fStd.length){
      log('', 'dim');
      log('【2/3】解析品类-标准类目文件…', 'info');
      for (const f of fStd){
        try { await parseStdFile(f); }
        catch (e){ log('  ✗ ' + e.message, 'err'); }
      }
    } else {
      log('', 'dim');
      log('⚠ 未上传「品类-标准类目」——支付金额 / 去退金额将为空', 'warn');
    }

    /* 3. 推广商品 */
    if (fAd.length){
      log('', 'dim');
      log('【3/3】解析推广商品文件…', 'info');
      for (const f of fAd){
        try { await parseAdFile(f); }
        catch (e){ log('  ✗ ' + e.message, 'err'); }
      }
      computeAdData();

      /* 未匹配统计 */
      const months = Object.keys(state.unmatched).sort();
      for (const m of months){
        const arr = state.unmatched[m];
        if (!arr.length) continue;
        const total = arr.reduce((s,x) => s + x.cost, 0);
        log(`  ⚠ ${m}：${arr.length} 个商品未匹配到类目，消耗合计 ¥${fmt(r2(total))}`, 'warn');
      }
    } else {
      log('', 'dim');
      log('⚠ 未上传「推广商品」——推广花费将为空', 'warn');
    }

    /* 汇总 */
    const months = getAllMonths();
    log('', 'dim');
    log('──────────────────────────────', 'dim');
    log(`✔ 解析完成　·　识别月份：${months.length ? months.join(' / ') : '无'}`, 'ok');
    log(`✔ 识别类目：${state.allCats.size} 个`, 'ok');

    /* 默认选中 */
    const existing = [...state.allCats];
    state.selectedCats = new Set(DEFAULT_CATS.filter(c => existing.includes(c)));
    if (state.selectedCats.size === 0){
      existing.slice(0, 10).forEach(c => state.selectedCats.add(c));
    }

    /* 渲染 UI */
    renderCatPicker();
    renderPreview();
    await refreshTemplates();

    $('pickSection').style.display = '';
    $('previewSection').style.display = '';
    $('runStatus').textContent = `已完成 · 共 ${months.length} 个月 · ${state.allCats.size} 个类目`;
    showToast('解析完成', 'success');

  } catch (e){
    log('✗ ' + (e && e.message ? e.message : e), 'err');
    showToast('解析失败：' + (e.message || e), 'error');
  } finally {
    btn.disabled = false;
  }
}

/* ================================================================
   渲染类目选择器
   ================================================================ */
function renderCatPicker(){
  const cats = [...state.allCats].sort((a,b) => {
    const ia = DEFAULT_CATS.indexOf(a);
    const ib = DEFAULT_CATS.indexOf(b);
    if (ia >= 0 && ib >= 0) return ia - ib;
    if (ia >= 0) return -1;
    if (ib >= 0) return 1;
    return a.localeCompare(b, 'zh');
  });

  const box = $('catList');
  if (!cats.length){
    box.innerHTML = '<div style="color:#94a3b8;padding:8px 4px;font-size:13px">未识别到任何类目</div>';
    return;
  }

  box.innerHTML = cats.map(c => {
    const on  = state.selectedCats.has(c) ? 'on' : '';
    const cnt = state.payData[getAllMonths()[0]] && state.payData[getAllMonths()[0]][c] ? '' : '';
    return `<div class="chip ${on}" data-cat="${esc(c)}">${esc(c)}</div>`;
  }).join('');

  box.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const cat = chip.dataset.cat;
      if (state.selectedCats.has(cat)) state.selectedCats.delete(cat);
      else state.selectedCats.add(cat);
      chip.classList.toggle('on');
      renderPreview();
    });
  });

  $('catHint').textContent = `已选 ${state.selectedCats.size} / ${cats.length} 个类目`;
}

/* ================================================================
   月份 & 取值
   ================================================================ */
function getAllMonths(){
  const s = new Set([...Object.keys(state.payData), ...Object.keys(state.adData)]);
  return [...s].sort();
}

function valueOf(month, cat){
  const p = state.payData[month] && state.payData[month][cat];
  const pay    = p ? p.pay : 0;
  const refund = p ? p.refund : 0;
  const ad     = (state.adData[month] && state.adData[month][cat]) || 0;
  return { pay: r2(pay), net: r2(pay - refund), ad: r2(ad), hasPay: !!p };
}

/* ================================================================
   渲染预览
   ================================================================ */
function renderPreview(){
  const cats   = [...state.selectedCats];
  const months = getAllMonths();
  const wrap   = $('previewWrap');

  $('catHint').textContent = `已选 ${cats.length} / ${state.allCats.size} 个类目`;

  if (!cats.length){
    wrap.innerHTML = '<div class="empty"><div class="ico">☝️</div><div>请至少选择一个类目</div></div>';
    $('previewHint').textContent = '';
    return;
  }
  if (!months.length){
    wrap.innerHTML = '<div class="empty"><div class="ico">📭</div><div>暂无数据</div></div>';
    $('previewHint').textContent = '';
    return;
  }

  /* 表头：两行 */
  let h1 = '<tr><th rowspan="2">类目</th>';
  let h2 = '<tr>';
  months.forEach(m => {
    h1 += `<th colspan="3">${esc(m)}</th>`;
    h2 += '<th>支付金额</th><th>去退金额</th><th>推广花费</th>';
  });
  h1 += '</tr>';
  h2 += '</tr>';

  /* 数据行 */
  const totals = months.map(() => ({ pay:0, net:0, ad:0 }));
  let body = '';

  cats.forEach(cat => {
    let row = `<tr><td>${esc(cat)}</td>`;
    months.forEach((m, idx) => {
      const v = valueOf(m, cat);
      totals[idx].pay += v.pay;
      totals[idx].net += v.net;
      totals[idx].ad  += v.ad;
      row += `<td class="pay ${v.pay ? '' : 'zero'}">${fmt(v.pay)}</td>`;
      row += `<td class="net ${v.net < 0 ? 'neg' : (v.net ? '' : 'zero')}">${fmt(v.net)}</td>`;
      row += `<td class="ad-cost ${v.ad ? '' : 'zero'}">${fmt(v.ad)}</td>`;
    });
    row += '</tr>';
    body += row;
  });

  /* 合计行 */
  let foot = '<tr><td>合计</td>';
  totals.forEach(t => {
    foot += `<td>${fmt(r2(t.pay))}</td>`;
    foot += `<td>${fmt(r2(t.net))}</td>`;
    foot += `<td>${fmt(r2(t.ad))}</td>`;
  });
  foot += '</tr>';

  wrap.innerHTML = `<table>
    <thead>${h1}${h2}</thead>
    <tbody>${body}</tbody>
    <tfoot>${foot}</tfoot>
  </table>`;

  $('previewHint').textContent = `${cats.length} 个类目 × ${months.length} 个月`;
}

/* ================================================================
   模板管理
   ================================================================ */
async function saveTemplate(){
  const name = $('tplName').value.trim();
  if (!name){ showToast('请输入模板名称', 'error'); $('tplName').focus(); return; }
  if (!state.selectedCats.size){ showToast('请至少选择一个类目', 'error'); return; }

  const tpl = {
    name,
    cats: [...state.selectedCats],
    mergeRules: $('mergeRules').value || '',
    createdAt: Date.now(),
  };

  try {
    const exists = (await dbAll()).find(t => t.name === name);
    if (exists){
      if (!confirm(`模板「${name}」已存在，是否覆盖？`)) return;
      await dbDel(exists.id);
    }
    await dbAdd(tpl);
    await refreshTemplates();
    $('tplSelect').value = '';
    showToast(`模板「${name}」已保存`, 'success');
    log(`✔ 模板已保存：${name}（${tpl.cats.length} 个类目）`, 'ok');
  } catch (e){
    showToast('保存失败：' + e.message, 'error');
  }
}

async function refreshTemplates(){
  try {
    const list = await dbAll();
    const sel  = $('tplSelect');
    const cur  = sel.value;
    sel.innerHTML = '<option value="">-- 我的模板 --</option>';
    list.sort((a,b) => b.createdAt - a.createdAt).forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = `${t.name}（${(t.cats||[]).length} 个类目）`;
      sel.appendChild(opt);
    });
    if (cur && list.some(t => String(t.id) === cur)) sel.value = cur;
  } catch (e){
    console.error('刷新模板失败', e);
  }
}

async function loadTemplate(){
  const id = $('tplSelect').value;
  if (!id){ showToast('请先选择一个模板', 'error'); return; }

  try {
    const list = await dbAll();
    const tpl  = list.find(t => String(t.id) === id);
    if (!tpl){ showToast('模板不存在', 'error'); return; }

    /* 过滤掉当前数据里不存在的类目 */
    const exist = [...state.allCats];
    const keep  = (tpl.cats || []).filter(c => exist.includes(c));
    const miss  = (tpl.cats || []).filter(c => !exist.includes(c));

    state.selectedCats = new Set(keep.length ? keep : exist);

    if (tpl.mergeRules != null){
      $('mergeRules').value = tpl.mergeRules;
      computeAdData();
    }

    renderCatPicker();
    renderPreview();

    if (miss.length){
      log(`⚠ 模板「${tpl.name}」中有 ${miss.length} 个类目当前数据不存在，已忽略：${miss.join('、')}`, 'warn');
      showToast(`已加载，忽略 ${miss.length} 个不存在的类目`, 'info');
    } else {
      showToast(`已加载模板「${tpl.name}」`, 'success');
    }
    log(`✔ 加载模板：${tpl.name}（命中 ${keep.length} 个类目）`, 'ok');

  } catch (e){
    showToast('加载失败：' + e.message, 'error');
  }
}

async function deleteTemplate(){
  const id = $('tplSelect').value;
  if (!id){ showToast('请先选择一个模板', 'error'); return; }
  if (!confirm('确认删除该模板？此操作不可恢复。')) return;
  try {
    await dbDel(Number(id));
    await refreshTemplates();
    showToast('模板已删除', 'success');
  } catch (e){
    showToast('删除失败：' + e.message, 'error');
  }
}

/* ================================================================
   导出 Excel
   ================================================================ */
function exportExcel(){
  const cats   = [...state.selectedCats];
  const months = getAllMonths();

  if (!cats.length || !months.length){
    showToast('没有可导出的数据', 'error');
    return;
  }

  const wb = XLSX.utils.book_new();

  /* ---------- Sheet 1：汇总宽表 ---------- */
  const h1 = ['类目'];
  const h2 = [''];
  months.forEach(m => { h1.push(m, '', ''); h2.push('支付金额','去退金额','推广花费'); });
  const aoa = [h1, h2];

  const totals = months.map(() => ({ pay:0, net:0, ad:0 }));
  cats.forEach(cat => {
    const row = [cat];
    months.forEach((m, idx) => {
      const v = valueOf(m, cat);
      totals[idx].pay += v.pay;
      totals[idx].net += v.net;
      totals[idx].ad  += v.ad;
      row.push(v.pay, v.net, v.ad);
    });
    aoa.push(row);
  });
  const totalRow = ['合计'];
  totals.forEach(t => totalRow.push(r2(t.pay), r2(t.net), r2(t.ad)));
  aoa.push(totalRow);

  const ws1 = XLSX.utils.aoa_to_sheet(aoa);

  /* 合并表头 */
  const merges = [{ s:{r:0,c:0}, e:{r:1,c:0} }];
  months.forEach((m, idx) => {
    const c = 1 + idx * 3;
    merges.push({ s:{r:0,c:c}, e:{r:0,c:c+2} });
  });
  ws1['!merges'] = merges;

  /* 列宽 */
  const cols = [{ wch:16 }];
  months.forEach(() => cols.push({ wch:13 }, { wch:13 }, { wch:13 }));
  ws1['!cols'] = cols;

  XLSX.utils.book_append_sheet(wb, ws1, '汇总宽表');

  /* ---------- Sheet 2：明细长表 ---------- */
  const long = [['类目','月份','支付金额','去退金额','推广花费']];
  cats.forEach(cat => {
    months.forEach(m => {
      const v = valueOf(m, cat);
      long.push([cat, m, v.pay, v.net, v.ad]);
    });
  });
  const ws2 = XLSX.utils.aoa_to_sheet(long);
  ws2['!cols'] = [{ wch:16 },{ wch:12 },{ wch:14 },{ wch:14 },{ wch:14 }];
  XLSX.utils.book_append_sheet(wb, ws2, '明细长表');

  /* ---------- Sheet 3：未匹配商品 ---------- */
  const missRows = [['月份','商品ID','商品名称','推广消耗']];
  let hasMiss = false;
  Object.keys(state.unmatched).sort().forEach(m => {
    state.unmatched[m].forEach(x => {
      missRows.push([m, x.id, x.name, r2(x.cost)]);
      hasMiss = true;
    });
  });
  if (hasMiss){
    const ws3 = XLSX.utils.aoa_to_sheet(missRows);
    ws3['!cols'] = [{ wch:10 },{ wch:16 },{ wch:50 },{ wch:12 }];
    XLSX.utils.book_append_sheet(wb, ws3, '未匹配商品');
  }

  const fname = `月度汇总_${months[0]}_至_${months[months.length-1]}.xlsx`;
  XLSX.writeFile(wb, fname);

  $('exportStatus').textContent = '已导出：' + fname;
  showToast('导出成功', 'success');
  log(`✔ 已导出：${fname}（${cats.length} 个类目 × ${months.length} 个月）`, 'ok');
}

/* ================================================================
   文件上传交互
   ================================================================ */
function setFiles(type, files){
  files = [...files].filter(f => /\.(xlsx|xls|csv)$/i.test(f.name));
  if (!files.length){
    showToast('请选择 .xlsx / .xls / .csv 文件', 'error');
    return;
  }

  const zone = document.querySelector(`.dropzone[data-type="${type}"]`);
  const label = zone.querySelector('.dz-file');

  if (type === 'cat'){
    state.files.cat = files[0];
    label.textContent = files[0].name;
    zone.classList.add('filled');
  } else {
    state.files[type] = files;
    if (files.length === 1){
      label.textContent = files[0].name;
    } else {
      label.textContent = `${files.length} 个文件：${files[0].name} 等`;
    }
    zone.classList.add('filled');
  }
  zone.title = files.map(f => f.name).join('\n');
}

function bindDropzone(){
  document.querySelectorAll('.dropzone').forEach(zone => {
    const type  = zone.dataset.type;
    const input = zone.querySelector('input[type=file]');

    input.addEventListener('change', e => {
      if (e.target.files.length){
        setFiles(type, e.target.files);
      }
      e.target.value = '';
    });

    zone.addEventListener('dragover', e => {
      e.preventDefault();
      zone.classList.add('drag');
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag');
      if (e.dataTransfer.files.length){
        setFiles(type, e.dataTransfer.files);
      }
    });
  });
}

/* ================================================================
   事件绑定
   ================================================================ */
function bindEvents(){
  $('btnRun').addEventListener('click', run);

  $('btnReset').addEventListener('click', () => {
    state.catMap = {}; state.payData = {}; state.adRaw = [];
    state.adData = {}; state.unmatched = {}; state.allCats = new Set();
    state.selectedCats = new Set();
    state.files = { cat:null, std:[], ad:[] };

    document.querySelectorAll('.dropzone').forEach(z => {
      z.classList.remove('filled');
      z.querySelector('.dz-file').textContent = '未选择';
      z.title = '';
    });

    $('mergeRules').value = '';
    $('pickSection').style.display = 'none';
    $('previewSection').style.display = 'none';
    $('runStatus').textContent = '';
    $('exportStatus').textContent = '';
    clearLog();
    log('已清空，等待上传文件…', 'dim');
    showToast('已清空', 'info');
  });

  $('btnAll').addEventListener('click', () => {
    state.selectedCats = new Set(state.allCats);
    renderCatPicker();
    renderPreview();
  });
  $('btnNone').addEventListener('click', () => {
    state.selectedCats = new Set();
    renderCatPicker();
    renderPreview();
  });
  $('btnInvert').addEventListener('click', () => {
    const next = new Set();
    state.allCats.forEach(c => { if (!state.selectedCats.has(c)) next.add(c); });
    state.selectedCats = next;
    renderCatPicker();
    renderPreview();
  });
  $('btnDefault').addEventListener('click', () => {
    const exist = [...state.allCats];
    state.selectedCats = new Set(DEFAULT_CATS.filter(c => exist.includes(c)));
    renderCatPicker();
    renderPreview();
  });

  $('btnSaveTpl').addEventListener('click', saveTemplate);
  $('btnLoadTpl').addEventListener('click', loadTemplate);
  $('btnDelTpl').addEventListener('click', deleteTemplate);
  $('tplName').addEventListener('keydown', e => { if (e.key === 'Enter') saveTemplate(); });

  $('btnExport').addEventListener('click', exportExcel);

  /* 归并规则变化时（防抖）重新归集 */
  let mergeTimer = null;
  $('mergeRules').addEventListener('input', () => {
    clearTimeout(mergeTimer);
    mergeTimer = setTimeout(() => {
      if (!state.adRaw.length) return;
      computeAdData();
      renderPreview();
      log('↻ 已按新的归并规则重新归集推广花费', 'info');
    }, 450);
  });
}

/* ================================================================
   初始化
   ================================================================ */
async function init(){
  bindDropzone();
  bindEvents();

  try {
    await openDB();
    await refreshTemplates();
    console.log('✅ IndexedDB 就绪');
  } catch (e){
    console.error('IndexedDB 初始化失败', e);
  }

  clearLog();
  log('📊 月度数据汇总工具已就绪', 'info');
  log('', 'dim');
  log('使用说明：', 'dim');

  log('', 'dim');

  log('  · 选择类目后可保存为模板，下次一键加载', 'dim');
}

document.addEventListener('DOMContentLoaded', init);
