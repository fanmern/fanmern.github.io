<body>
        <div id="wrap" align="center">
        </div>
        <!-- Ctrl+F 搜索定位浮层：匹配到的商品卡片会播放动画并滚动到视野中央 -->
        <div id="search-overlay" class="search-overlay" style="display:none;">
                <div id="search-field-toggle" class="search-field-toggle">
                        <button type="button" class="toggle-btn active" data-field="code">编码</button>
                        <button type="button" class="toggle-btn" data-field="id">ID</button>
                </div>
                <input id="search-input" type="text" placeholder="搜索编码…" autocomplete="off" spellcheck="false" />
                <span id="search-count" class="search-count"></span>
        </div>
        <!-- 引入 QRCode.js 库 -->
        <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</body>
<script type="text/javascript">
        fetch('https://fanmern.com/fmr.json')
                .then(response => response.json())
                .then(data => {
                        loadUIElement(data)
                })
                .catch(error => {
                        console.error('Error loading JSON:', error);
                });

        function loadUIElement(data) {
                for (let index = 0; index < data.length; index++) {
                        const element = data[index];
                        const p_id = element.id
                        const p_code = element.code
                        const p_node = element.node
                        var div_product = document.createElement("div")
                        div_product.setAttribute("class", "product")
                        // 记录商品信息，供页内 Ctrl+F 搜索定位使用
                        div_product.setAttribute("data-id", p_id)
                        div_product.setAttribute("data-code", p_code)
                        div_product.setAttribute("data-node", p_node)

                        // ★ 隐藏的 id：Ctrl+F 可以搜到，但页面上不可见、不占布局（放在卡片内，可滚动定位）
                        var hiddenId = document.createElement("span");
                        hiddenId.setAttribute("class", "hidden-id");
                        hiddenId.textContent = p_id;
                        div_product.appendChild(hiddenId);

                        // 图
                        var img = document.createElement("img")
                        img.setAttribute("class", "img-container")
                        img.setAttribute("id", p_id)
                        img.setAttribute("alt", p_code)
                        img.setAttribute("onclick", "copyToClipBoard(this)")
                        img.setAttribute("ondblclick", "copyToClipBoardWithCode(this)")
                        img_url = element.img + "_430x430q90.jpg"
                        img.setAttribute("src", img_url)
                        var div_img = document.createElement("div")
                        div_img.setAttribute("class", "img_product")
                        div_img.appendChild(img)

                        // 创建二维码按钮（悬停弹出商品二维码）
                        const qrButton = document.createElement('button');
                        qrButton.classList.add('qr-button');
                        qrButton.setAttribute("id", p_id)
                        qrButton.innerHTML = '<img src="https://img.alicdn.com/imgextra/i3/O1CN01CkZbKp27arsx4ktdK_!!6000000007814-2-tps-96-96.png" alt="二维码" class="button-icon">';
                        div_img.appendChild(qrButton);

                        // 创建二维码容器（悬停时在容器内生成并弹出二维码）
                        const qrCodeContainer = document.createElement('div');
                        qrCodeContainer.classList.add('qr-code', 'right');
                        qrCodeContainer.id = `qr-code-${index}`;
                        div_img.appendChild(qrCodeContainer);

                        div_product.appendChild(div_img);

                        let qrCode = null;
                        let timeoutId = null;

                        qrButton.addEventListener('mouseenter', () => {
                                timeoutId = setTimeout(() => {
                                        if (!qrCode) {
                                                // 首次悬停才生成二维码，内容为商品天猫详情页链接
                                                qrCode = new QRCode(qrCodeContainer, {
                                                        text: 'https://detail.tmall.com/item.htm?id=' + p_id,
                                                        width: 160,
                                                        height: 160,
                                                        colorDark: '#000000',
                                                        colorLight: '#ffffff',
                                                        correctLevel: QRCode.CorrectLevel.M
                                                });
                                        }
                                        qrCodeContainer.classList.add('visible');
                                }, 300);
                        });

                        qrButton.addEventListener('mouseleave', () => {
                                clearTimeout(timeoutId);
                                qrCodeContainer.classList.remove('visible');
                        });

                        // 创建类目按钮（悬停弹出类目名称），与右侧二维码按钮对称
                        const catButton = document.createElement('button');
                        catButton.classList.add('cat-button');
                        catButton.innerHTML = '<img src="https://img.alicdn.com/imgextra/i2/3533997285/O1CN01g1xrZY23gaRXCPS5R_!!3533997285.png" alt="类目" class="button-icon">';
                        div_img.appendChild(catButton);

                        // 类目弹出容器
                        const catCodeContainer = document.createElement('div');
                        catCodeContainer.classList.add('qr-code', 'left');
                        catCodeContainer.innerText = p_node;
                        div_img.appendChild(catCodeContainer);

                        let catTimeoutId = null;
                        catButton.addEventListener('mouseenter', () => {
                                catTimeoutId = setTimeout(() => {
                                        catCodeContainer.classList.add('visible');
                                }, 300);
                        });

                        catButton.addEventListener('mouseleave', () => {
                                clearTimeout(catTimeoutId);
                                catCodeContainer.classList.remove('visible');
                        });

                        // 链接
                        var div_detail = document.createElement("div")
                        div_detail.setAttribute("class", "detail")
                        var a1 = document.createElement("a")
                        a1.setAttribute("target", "_blank")
                        a1.setAttribute("href", "https://detail.tmall.com/item.htm?id=" + p_id)
                        a1.innerText = element.code
                        var a2 = document.createElement("a")
                        a2.setAttribute("target", "_blank")
                        a2.setAttribute("href", "https://sycm.taobao.com/cc/item_archives?activeKey=flow&dateType=day&itemId=" + p_id)
                        a2.innerText = "商品360"
                        var a3 = document.createElement("a")
                        a3.setAttribute("target", "_blank")
                        a3.setAttribute("href", "https://myseller.taobao.com/home.htm/SellManage/all?current=1&pageSize=20&queryItemId=" + p_id)
                        a3.innerText = "编辑"

                        div_detail.appendChild(a1)
                        div_detail.appendChild(a2)
                        div_detail.appendChild(a3)
                        div_product.appendChild(div_detail)

                        var container = document.getElementById('wrap');
                        container.appendChild(div_product);
                }
        }

        // ============ 页内查找：Ctrl+F / Cmd+F 打开，命中的商品卡片播放动画并滚动到中央 ============
        var searchOverlay = document.getElementById('search-overlay');
        var searchInput = document.getElementById('search-input');
        var searchCount = document.getElementById('search-count');
        var matchList = [];
        var currentMatchIndex = -1;
        var searchField = 'code'; // 默认按编码搜索，可切换为按 id 搜索

        document.addEventListener('keydown', function (eve) {
                if ((eve.ctrlKey || eve.metaKey) && (eve.key === 'f' || eve.key === 'F')) {
                        eve.preventDefault();
                        openSearch();
                } else if (eve.key === 'Escape') {
                        closeSearch();
                }
        });

        function openSearch() {
                if (searchOverlay.style.display === 'flex') { searchInput.select(); return; }
                searchOverlay.style.display = 'flex';
                searchInput.value = '';
                searchCount.textContent = '';
                matchList = [];
                currentMatchIndex = -1;
                clearHighlights();
                searchInput.focus();
        }

        function closeSearch() {
                searchOverlay.style.display = 'none';
                searchInput.value = '';
                searchCount.textContent = '';
                matchList = [];
                currentMatchIndex = -1;
                clearHighlights();
        }

        function allCards() {
                return Array.prototype.slice.call(document.querySelectorAll('.product'));
        }

        function doSearch() {
                var q = searchInput.value.trim();
                clearHighlights();
                if (!q) {
                        searchCount.textContent = '';
                        matchList = [];
                        currentMatchIndex = -1;
                        return;
                }

                // 支持用逗号、空格、中文逗号、换行分隔多个关键词
                var keywords = q.split(/[,，\s\n]+/).filter(function (k) { return k.length > 0; });
                var attr = searchField === 'code' ? 'data-code' : 'data-id';

                matchList = allCards().filter(function (card) {
                        var text = (card.getAttribute(attr) || '').toLowerCase();
                        return keywords.some(function (kw) {
                                return text.indexOf(kw.toLowerCase()) !== -1;
                        });
                });

                if (matchList.length > 0) {
                        currentMatchIndex = 0;
                        highlightAllMatches();
                } else {
                        searchCount.textContent = '无匹配';
                        currentMatchIndex = -1;
                }
        }

        function highlightAllMatches() {
                if (matchList.length === 0) return;
                allCards().forEach(function (c) { c.classList.remove('found', 'found-current'); });
                matchList.forEach(function (card) {
                        void card.offsetWidth;
                        card.classList.add('found');
                });
                searchCount.textContent = '匹配 ' + matchList.length + ' 个';
                var firstCard = matchList[0];
                if (firstCard) {
                        scrollToCard(firstCard);
                }
        }

        function highlightSingleMatch() {
                if (matchList.length === 0) return;
                matchList.forEach(function (c) {
                        c.classList.add('found');
                        c.classList.remove('found-current');
                });
                var card = matchList[currentMatchIndex];
                card.classList.add('found-current');
                searchCount.textContent = (currentMatchIndex + 1) + ' / ' + matchList.length;
                scrollToCard(card);
        }

        function scrollToCard(card) {
                const container = document.documentElement;
                const rect = card.getBoundingClientRect();
                const targetY = window.scrollY + rect.top - window.innerHeight / 2 + rect.height / 2;

                const startY = window.scrollY;
                const distance = targetY - startY;
                const duration = 300; // 毫秒，数字越小越快
                const startTime = performance.now();

                function step(currentTime) {
                        const elapsed = currentTime - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        // easeInOut 缓动函数
                        const ease = progress < 0.5
                                ? 2 * progress * progress
                                : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                        window.scrollTo(0, startY + distance * ease);
                        if (progress < 1) {
                                requestAnimationFrame(step);
                        }
                }
                requestAnimationFrame(step);
        }

        function clearHighlights() {
                allCards().forEach(function (c) {
                        c.classList.remove('found', 'found-current');
                });
        }

        searchInput.addEventListener('input', doSearch);
        searchInput.addEventListener('keydown', function (eve) {
                if (eve.key === 'Enter') {
                        eve.preventDefault();
                        if (matchList.length > 0) {
                                currentMatchIndex = (currentMatchIndex + 1) % matchList.length;
                                highlightSingleMatch();
                        }
                }
        });

        // 编码 / ID 搜索模式切换
        document.getElementById('search-field-toggle').addEventListener('click', function (eve) {
                if (eve.target.classList.contains('toggle-btn')) {
                        document.querySelectorAll('.toggle-btn').forEach(function (b) { b.classList.remove('active'); });
                        eve.target.classList.add('active');
                        searchField = eve.target.getAttribute('data-field');
                        searchInput.placeholder = (searchField === 'code') ? '搜索编码…' : '搜索 ID…';
                        doSearch();
                }
        });

        function copyToClipBoard(obj) {
                const input = document.createElement('input');
                document.body.appendChild(input);
                input.setAttribute('value', obj.id);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
        };
        function copyToClipBoardWithCode(obj) {
                const input = document.createElement('input');
                document.body.appendChild(input);
                input.setAttribute('value', obj.alt);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
        };

        //长按并松开只触发一次(点击Home到店铺主页)
        document.onkeyup = keyboard;
        function keyboard(eve) {
                if (eve.key == "Home") {
                        window.open("https://fanmeiren.tmall.com/search.htm?scene=taobao_shop&search=y&orderType=newOn_desc&tsearch=y");
                }
        }
        document.onkeyup = keyboard;


</script>
