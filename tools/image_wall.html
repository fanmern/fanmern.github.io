<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>商品图墙 · 模板导入</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --line:#e6e8ec;
    --text:#1f2329;
    --muted:#8a9099;
    --accent:#ff5000;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:var(--bg);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ============ 顶部工具栏 ============ */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 18px;
    background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px}
  .logo{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,#ff7a45,#ff5000);
    color:#fff;font-size:12px;font-weight:700;letter-spacing:.5px;
  }
  .title{font-weight:600;font-size:15px;white-space:nowrap}
  .count{color:var(--muted);font-size:12.5px;white-space:nowrap}

  .search{flex:1 1 180px;min-width:150px;max-width:360px;position:relative}
  .search input{
    width:100%;height:34px;padding:0 12px 0 32px;
    border:1px solid var(--line);border-radius:9px;background:#fff;
    font-size:13px;color:var(--text);outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search input:focus{border-color:#ffb08a;box-shadow:0 0 0 3px rgba(255,80,0,.10)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}

  /* 每行列数控制 */
  .cols{
    display:flex;align-items:center;gap:8px;
    height:34px;padding:0 12px;border:1px solid var(--line);
    border-radius:9px;background:#fff;white-space:nowrap;
  }
  .cols span{font-size:12.5px;color:var(--muted)}
  .cols input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:88px;height:4px;border-radius:3px;background:#e6e8ec;outline:none;
  }
  .cols input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:linear-gradient(135deg,#ff7a45,#ff5000);
    cursor:pointer;box-shadow:0 1px 4px rgba(255,80,0,.4);
  }
  .cols input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:#ff5000;cursor:pointer;
  }
  .cols b{font-size:13px;color:var(--accent);min-width:14px;text-align:center}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .btn{
    height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--text);font-size:13px;cursor:pointer;
    transition:all .15s;white-space:nowrap;
  }
  .btn:hover{border-color:#d0d4da;background:#fafbfc}
  .btn:active{transform:translateY(1px)}
  .btn.primary{
    background:linear-gradient(135deg,#ff7a45,#ff5000);
    border-color:transparent;color:#fff;font-weight:500;
    box-shadow:0 2px 8px rgba(255,80,0,.28);
  }
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{color:var(--muted)}

  /* ============ 图墙 ============ */
  .stage{flex:1;display:flex;flex-direction:column;min-height:0}

  .grid{
    --cols:5;
    flex:1;
    display:grid;
    grid-template-columns:repeat(var(--cols),minmax(0,1fr));
    gap:14px;
    padding:16px 18px 40px;
    align-content:start;
  }

  .card{
    display:flex;flex-direction:column;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    text-decoration:none;color:inherit;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    will-change:transform;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 24px rgba(23,26,31,.10);
    border-color:#dfe3e8;
  }
  .thumb{
    position:relative;width:100%;aspect-ratio:1/1;
    background:#f0f1f3;overflow:hidden;
  }
  .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .3s ease;
  }
  .card:hover .thumb img{transform:scale(1.04)}

  .meta{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px}
  .name{
    font-size:13px;line-height:1.35;font-weight:500;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;min-height:35px;word-break:break-all;
  }
  .sub{display:flex;flex-wrap:wrap;gap:4px}
  .chip{
    font-size:11px;line-height:17px;padding:0 7px;border-radius:5px;
    background:#f4f5f7;color:#6b7280;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .chip.shop{background:#fff3ec;color:#e04a00}

  /* ============ 空状态 ============ */
  .empty{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:60px 20px;text-align:center;color:var(--muted);
  }
  .empty .icon{
    width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    background:#fff;border:1px solid var(--line);font-size:28px;
  }
  .empty h2{margin:6px 0 0;font-size:17px;color:var(--text);font-weight:600}
  .empty p{margin:0;font-size:13px}
  .empty .hint{
    margin-top:8px;padding:12px 18px;border-radius:10px;background:#fff;
    border:1px dashed #d8dce2;font-size:12.5px;line-height:1.9;max-width:620px;text-align:left;
  }
  .empty code{
    background:#f2f4f7;padding:1px 6px;border-radius:5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#4a5260;
  }

  /* ============ 拖拽 / 提示 ============ */
  .drop-mask{
    position:fixed;inset:0;z-index:60;display:none;
    align-items:center;justify-content:center;
    background:rgba(255,80,0,.08);backdrop-filter:blur(1px);
    border:3px dashed var(--accent);
    color:var(--accent);font-size:18px;font-weight:600;
  }
  .drop-mask.show{display:flex}

  .toast{
    position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
    background:rgba(23,26,31,.9);color:#fff;padding:10px 18px;border-radius:10px;
    font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:80;
    max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ============ 响应式 ============ */
  @media (max-width:1180px){
    .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
    .cols{display:none}
  }
  @media (max-width:820px){
    .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .title{display:none}
  }
  @media (max-width:600px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px}
    .search{flex:1 1 100%;max-width:none;order:3}
    .actions{flex:1 1 100%;margin-left:0}
    .btn{flex:1;padding:0 8px}
  }
</style>
</head>
<body>

<!-- ================= 工具栏 ================= -->
<header class="topbar">
  <div class="brand">
    <span class="logo">图墙</span>
    <span class="title">商品图墙</span>
    <span class="count" id="count">共 0 个商品</span>
  </div>

  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input id="search" type="search" placeholder="搜索名称 / 店铺…" autocomplete="off" />
  </div>

  <div class="cols">
    <span>每行</span>
    <input type="range" id="colsRange" min="2" max="8" step="1" value="5" />
    <b id="colsVal">5</b>
  </div>

  <div class="actions">
    <button class="btn primary" id="btnTemplate">导出模版</button>
    <button class="btn" id="btnImport">导入数据</button>
    <button class="btn ghost" id="btnClear">清空</button>
  </div>

  <input type="file" id="file" accept=".xlsx,.xls,.csv,.txt" hidden />
</header>

<!-- ================= 内容区 ================= -->
<main class="stage">
  <div class="grid" id="grid"></div>

  <div class="empty" id="empty">
    <div class="icon">🖼️</div>
    <h2>还没有数据</h2>
    <p>点击「导出模版」，按模版填好后再点「导入数据」</p>
    <div class="hint">
      <b>模版列说明</b><br />
      · <code>商品图片链接</code>　商品主图地址，支持 <code>//</code> 开头<br />
      · <code>链接显示的名字</code>　卡片上显示的主标题<br />
      · <code>跳转的链接</code>　点击卡片跳转的地址（留空则用商品ID拼天猫详情页）<br />
      · <code>商品ID</code>　自动拼成 <code>https://detail.tmall.com/item.htm?id=商品ID</code><br />
      · <code>店铺名称</code>　显示在卡片上的店铺标签<br />
      · 模版外自行增加的列（如价格、尺码）会作为标签一并展示
    </div>
  </div>
</main>

<div class="drop-mask" id="dropMask">松开鼠标即可导入文件</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
 *  工具函数
 * =======================================================*/
const $ = id => document.getElementById(id);

const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">' +
  '<rect width="100%" height="100%" fill="#f0f1f3"/>' +
  '<g fill="#c9ced6">' +
  '<rect x="100" y="105" width="100" height="72" rx="10" opacity=".75"/>' +
  '<circle cx="128" cy="132" r="10"/>' +
  '<path d="M100 177l30-32 20 22 16-14 34 24z" opacity=".9"/>' +
  '</g>' +
  '<text x="150" y="215" font-size="15" fill="#a8aeb8" text-anchor="middle" ' +
  'font-family="sans-serif">暂无图片</text>' +
  '</svg>'
);

/* 表头归一化 */
function norm(s){
  return String(s == null ? '' : s)
    .trim().toLowerCase()
    .replace(/[\s_\-（）()【】\[\]：:]/g, '');
}

/* 列名别名（按优先级排列，先精确匹配后包含匹配） */
const ALIAS = {
  img : ['商品图片链接','图片地址','图片链接','主图链接','商品主图','商品图片','图片路径','图片url','主图','图片','imageurl','picurl','image','img','pic'],
  name: ['链接显示的名字','显示的名字','商品名称','商品标题','宝贝名称','显示名称','goodsname','productname','名称','标题','title','name'],
  link: ['跳转的链接','跳转链接','商品链接','链接地址','详情链接','detailurl','itemurl','链接','url','link','href'],
  id  : ['商品id','商品编号','宝贝id','商品货号','itemid','numiid','id'],
  shop: ['店铺名称','店铺名','商家名称','卖家名称','shopname','storename','店铺','店名','shop','store','seller']
};
const FIELDS = Object.keys(ALIAS);       // img / name / link / id / shop

/* 图片地址补协议 */
function fixUrl(u){
  if (!u) return '';
  u = String(u).trim();
  if (/^\/\//.test(u)) return 'https:' + u;
  if (/^http:\/\//i.test(u)) return u.replace(/^http:\/\//i, 'https://');
  return u;
}

/* 生成跳转链接 */
function buildLink(rawLink, rawId){
  let link = String(rawLink == null ? '' : rawLink).trim();
  let id   = String(rawId   == null ? '' : rawId).trim();

  // 「链接」列里如果填的其实是纯数字ID
  if (/^\d{6,}$/.test(link)) {
    if (!id) id = link;
    link = '';
  }
  if (link){
    if (/^\/\//.test(link)) link = 'https:' + link;
    else if (!/^https?:\/\//i.test(link)) link = 'https://' + link;
    return link;
  }
  if (id) return 'https://detail.tmall.com/item.htm?id=' + encodeURIComponent(id);
  return '';
}

/* =========================================================
 *  表头 → 字段映射
 * =======================================================*/
function classifyColumns(headers){
  const map = {};            // normKey -> field
  const used = new Set();

  // 第一轮：完全相等
  headers.forEach(h => {
    const n = norm(h);
    if (!n || map[n]) return;
    for (const f of FIELDS){
      if (used.has(f)) continue;
      if (ALIAS[f].some(a => norm(a) === n)){ map[n] = f; used.add(f); return; }
    }
  });

  // 第二轮：包含匹配
  headers.forEach(h => {
    const n = norm(h);
    if (!n || map[n]) return;
    for (const f of FIELDS){
      if (used.has(f)) continue;
      if (ALIAS[f].some(a => n.includes(norm(a)))){ map[n] = f; used.add(f); return; }
    }
  });

  return map;
}

/* =========================================================
 *  行数据 → 商品数组
 * =======================================================*/
function buildItems(rows){
  if (!rows || !rows.length) return [];

  // 收集全部表头（保持顺序）
  const headers = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if (!headers.includes(k)) headers.push(k); }));

  const classMap = classifyColumns(headers);
  const items = [];

  rows.forEach(row => {
    const info = { img:'', name:'', link:'', id:'', shop:'', extras:[] };

    Object.keys(row).forEach(k => {
      const val = String(row[k] == null ? '' : row[k]).trim();
      if (!val) return;
      const f = classMap[norm(k)];
      if (f && !info[f]) info[f] = val;          // 命中已知字段且尚未赋值
      else info.extras.push({ key: k, value: val });  // 其余作为展示标签
    });

    const img  = fixUrl(info.img);
    const link = buildLink(info.link, info.id);

    if (!img && !link && !info.name && !info.shop && !info.extras.length) return;

    // 主标题：优先「链接显示的名字」，没有则退化用店铺名
    let title  = info.name;
    let shop   = info.shop;
    if (!title && shop){ title = shop; shop = ''; }

    const chips = [];
    if (shop) chips.push({ key: '店铺名称', value: shop, shop: true });
    info.extras.forEach(e => chips.push(e));

    items.push({
      img,
      name: title || '未命名商品',
      link,
      chips
    });
  });

  return items;
}

/* =========================================================
 *  Excel / CSV 解析
 * =======================================================*/
function sheetToRows(ws){
  const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:false, blankrows:false });
  if (!aoa.length) return [];

  const keys = ['图片','名称','标题','链接','店铺','id','url','link','name','image','img','title','shop'];
  let headerIdx = 0;

  for (let i = 0; i < Math.min(aoa.length, 10); i++){
    const row = (aoa[i] || []).map(c => String(c).toLowerCase());
    const hits = row.filter(c => c && keys.some(k => c.includes(k))).length;
    if (hits >= 2){ headerIdx = i; break; }
  }

  const headers = (aoa[headerIdx] || []).map((h, i) => String(h || '').trim() || ('列' + (i + 1)));

  return aoa.slice(headerIdx + 1).map(row => {
    const o = {};
    headers.forEach((h, i) => { o[h] = row[i] === undefined || row[i] === null ? '' : row[i]; });
    return o;
  });
}

/* 纯文本（Tab / 逗号分隔）解析，用于 CSV 兜底 */
function parseDelimited(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
  if (!lines.length) return [];

  const sep = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(sep).map(h => h.trim().replace(/^"|"$/g, ''));

  return lines.slice(1).map(line => {
    const cells = line.split(sep).map(c => c.trim().replace(/^"|"$/g, ''));
    const o = {};
    headers.forEach((h, i) => { o[h] = cells[i] !== undefined ? cells[i] : ''; });
    return o;
  });
}

/* =========================================================
 *  状态 & 渲染
 * =======================================================*/
const state = { items: [], keyword: '' };
const gridEl = $('grid');

function render(){
  const kw = state.keyword.trim().toLowerCase();

  const list = kw
    ? state.items.filter(it => {
        const hay = [it.name, ...it.chips.map(c => c.value)].join(' ').toLowerCase();
        return hay.includes(kw);
      })
    : state.items;

  $('count').textContent = kw
    ? `筛选出 ${list.length} / ${state.items.length} 个商品`
    : `共 ${list.length} 个商品`;

  gridEl.innerHTML = '';

  if (!list.length){
    $('empty').style.display = 'flex';
    gridEl.style.display = 'none';
    return;
  }
  $('empty').style.display = 'none';
  gridEl.style.display = 'grid';

  const frag = document.createDocumentFragment();

  list.forEach(it => {
    const card = document.createElement(it.link ? 'a' : 'div');
    card.className = 'card';
    if (it.link){
      card.href = it.link;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
    }

    /* 图片 */
    const thumb = document.createElement('div');
    thumb.className = 'thumb';

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';       // 绕过图床防盗链
    img.alt = it.name;
    img.src = it.img || PLACEHOLDER;
    img.onerror = function(){ this.onerror = null; this.src = PLACEHOLDER; };
    thumb.appendChild(img);

    /* 文字 */
    const meta = document.createElement('div');
    meta.className = 'meta';

    const nm = document.createElement('div');
    nm.className = 'name';
    nm.textContent = it.name;
    nm.title = it.name;
    meta.appendChild(nm);

    if (it.chips.length){
      const sub = document.createElement('div');
      sub.className = 'sub';
      it.chips.slice(0, 4).forEach(c => {
        const chip = document.createElement('span');
        chip.className = 'chip' + (c.shop ? ' shop' : '');
        chip.textContent = c.value;
        chip.title = c.key + '：' + c.value;
        sub.appendChild(chip);
      });
      meta.appendChild(sub);
    }

    card.appendChild(thumb);
    card.appendChild(meta);
    frag.appendChild(card);
  });

  gridEl.appendChild(frag);
}

/* =========================================================
 *  数据装载
 * =======================================================*/
function loadItems(items, tipText){
  if (!items.length){
    toast('没有解析到有效数据，请确认表头是否与模版一致');
    return;
  }
  state.items = items;
  state.keyword = '';
  $('search').value = '';
  render();
  toast(tipText || `成功导入 ${items.length} 条数据`);
}

/* 读取文件 */
async function readFile(file){
  const name = file.name.toLowerCase();
  const isText = /\.(csv|txt)$/.test(name);

  if (typeof XLSX === 'undefined'){
    if (isText){
      const text = await file.text();
      loadItems(buildItems(parseDelimited(text)));
    } else {
      toast('解析组件加载失败，请联网后重试');
    }
    return;
  }

  const buf = await file.arrayBuffer();
  let wb;

  if (isText){
    const text = new TextDecoder('utf-8').decode(buf);
    wb = XLSX.read(text, { type:'string' });
  } else {
    wb = XLSX.read(new Uint8Array(buf), { type:'array' });
  }

  let rows = [];
  wb.SheetNames
    .filter(n => n !== '填写说明')
    .forEach(sn => { rows = rows.concat(sheetToRows(wb.Sheets[sn])); });

  loadItems(buildItems(rows));
}

/* =========================================================
 *  导出模版
 * =======================================================*/
const TEMPLATE_HEADERS = ['商品图片链接','链接显示的名字','跳转的链接','商品ID','店铺名称'];

const TEMPLATE_TIPS = [
  ['列名', '填写说明'],
  ['商品图片链接', '商品主图的完整地址，支持 // 开头的地址（导入时自动补 https:）'],
  ['链接显示的名字', '卡片上显示的主标题，例如：芭蕾风交叉美背瑜伽背心'],
  ['跳转的链接', '点击卡片后跳转的地址；留空时会自动用「商品ID」拼成天猫详情页'],
  ['商品ID', '商品数字ID，与「跳转的链接」二选一即可'],
  ['店铺名称', '卡片上显示的店铺标签，可留空'],
  ['（可选）其他列', '模版之外自行增加的列（如价格、尺码、颜色）会作为标签显示在卡片上']
];

function exportTemplate(){
  if (typeof XLSX === 'undefined'){
    // 兜底：导出 CSV
    downloadCSV('商品图墙导入模版.csv', [TEMPLATE_HEADERS]);
    toast('已导出 CSV 模版（未能加载 xlsx 组件）');
    return;
  }

  const wb = XLSX.utils.book_new();

  const ws = XLSX.utils.aoa_to_sheet([TEMPLATE_HEADERS]);
  ws['!cols'] = [{ wch:62 }, { wch:30 }, { wch:48 }, { wch:20 }, { wch:24 }];
  ws['!freeze'] = { xSplit:0, ySplit:1 };
  XLSX.utils.book_append_sheet(wb, ws, '商品数据');

  const ws2 = XLSX.utils.aoa_to_sheet(TEMPLATE_TIPS);
  ws2['!cols'] = [{ wch:20 }, { wch:78 }];
  XLSX.utils.book_append_sheet(wb, ws2, '填写说明');

  XLSX.writeFile(wb, '商品图墙导入模版.xlsx');
  toast('模版已导出，按表头填写后再导入');
}

function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(c => {
    const s = String(c == null ? '' : c);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\r\n');

  const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =========================================================
 *  交互
 * =======================================================*/
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

/* 导出模版 */
$('btnTemplate').addEventListener('click', exportTemplate);

/* 导入数据 */
$('btnImport').addEventListener('click', () => $('file').click());

$('file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  if (f){
    try { await readFile(f); }
    catch (err){ console.error(err); toast('文件解析失败：' + err.message); }
  }
  e.target.value = '';
});

/* 搜索 */
$('search').addEventListener('input', e => {
  state.keyword = e.target.value;
  render();
});

/* 每行列数 */
$('colsRange').addEventListener('input', e => {
  const n = Number(e.target.value);
  $('colsVal').textContent = n;
  gridEl.style.setProperty('--cols', n);
});

/* 清空 */
$('btnClear').addEventListener('click', () => {
  state.items = [];
  state.keyword = '';
  $('search').value = '';
  render();
  toast('已清空');
});

/* 拖拽导入 */
let dragDepth = 0;
window.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  $('dropMask').classList.add('show');
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', e => {
  e.preventDefault();
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) $('dropMask').classList.remove('show');
});
window.addEventListener('drop', async e => {
  e.preventDefault();
  dragDepth = 0;
  $('dropMask').classList.remove('show');
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  try { await readFile(f); }
  catch (err){ console.error(err); toast('文件解析失败：' + err.message); }
});

/* 初始化 */
gridEl.style.setProperty('--cols', $('colsRange').value);
render();
</script>
</body>
</html>
